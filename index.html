function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

    return (
        username.toLowerCase() +
        "@" +
        EMAIL_DOMAIN

function validUsername(username) {

    return /^[A-Za-z0-9_]{3,24}$/.test(username);
}


function validPassword(password) {

    return password.length >= 6;
}

    Load the currently authenticated user.
*/

    const result =
        await supabase.auth.getSession();

    if (
        result.data &&
        result.data.session
    ) {

        currentUser =
            result.data.session.user;

        await loadProfile();
    }

    updatePrompt();
}


/*
    Load username from profiles.
*/

async function loadProfile() {

    if (!currentUser)
        return;

    const result =
        await supabase
            .from("profiles")
            .select("username,name")
            .eq("id", currentUser.id)
            .maybeSingle();


    if (result.data) {

        currentUsername =
            result.data.username ||
            result.data.name ||
            null;

    } else {

        currentUsername =
            currentUser.user_metadata?.username ||
            null;
    }

    updatePrompt();
}

    Sign up.

    Usage:

    Signup username password
*/

async function signup(args) {

    if (args.length < 2) {

        return (
            "USAGE: Signup [user] [password]"
        );
    }


    const username =
        args[0];

    const password =
        args.slice(1).join(" ");


    if (!validUsername(username)) {

        return (
            "ERROR: INVALID USERNAME.\n" +
            "USE 3-24 CHARACTERS.\n" +
            "LETTERS, NUMBERS AND _ ONLY."
        );
    }


    if (!validPassword(password)) {

        return (
            "ERROR: PASSWORD MUST BE " +
            "AT LEAST 6 CHARACTERS."
        );
    }


    const existing =
        await supabase
            .from("profiles")
            .select("id")
            .eq("username", username)
            .maybeSingle();


    if (existing.error) {

        return (
            "DATABASE ERROR: " +
            existing.error.message
        );
    }


    if (existing.data) {

        return (
            "ERROR: USER ALREADY EXISTS."
        );
    }


    const email =
        usernameEmail(username);


    const result =
        await supabase.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    username: username
                }

            }

        });


    if (result.error) {

        return (
            "SIGNUP ERROR: " +
            result.error.message
        );
    }


    if (!result.data.user) {

        return "SIGNUP FAILED.";
    }


    currentUser =
        result.data.user;


    currentUsername =
        username;


    updatePrompt();


    /*

    );

            .select("username,created_at")

                {
                    ascending: true
                }

    if (result.error) {

                user.username
            );

        }
    );


    return lines.join("\n");
}

                "created_at",
                {
                    ascending: true
                }

    if (result.error) {

            message.username +
            ": " +
            message.message

    return lines.join("\n");

async function postForum(args) {

    const message =

    const result =
        await supabase

                username:
                    currentUsername,

                message:
                    message

            });


    if (result.error) {

        return (
            "FORUM ERROR: " +
            result.error.message
        );
    }


    return "MESSAGE POSTED.";
}


/*
    Realtime forum.

    New messages appear automatically.
*/

function subscribeForum() {

    if (forumChannel) {

        supabase.removeChannel(
            forumChannel
        );

    forumChannel =
        supabase
            .channel("access-global-forum")

            .on(

                    table: "forum_messages"

                    print(

                        message.username +
                        ": " +
                        message.message,

                        "cyan"
                    );

                }

            )

            .subscribe();
}

async function runCommand(raw) {

    const commandLine =
        raw.trim();


    if (!commandLine)
        return;


    commandHistory.push(
        commandLine
    );


    historyIndex =
        commandHistory.length;


    print(

        (currentUsername ||
            "guest") +
        "@access:~$ " +
        commandLine,

        "white"

    );


    const parts =
        commandLine.match(
            /(?:[^\s"]+|"[^"]*")+/g
        ) || [];


    const command =
        (
            parts.shift() ||
            ""
        ).toLowerCase();


    const args =
        parts.map(
            value =>
                value.replace(
                    /^"|"$/g,
                    ""
                )
        );


    if (!commands[command]) {

        print(
            "COMMAND NOT FOUND: " +
            command,
            "red"
        );

        print(
            "TYPE HELP FOR AVAILABLE COMMANDS.",
            "dim"
        );

        return;
    }


    try {

        const result =
            await commands[command](args);


        if (result)
            print(result);

    } catch (error) {

        print(
            "COMMAND ERROR: " +
            error.message,
            "red"
        );
    }
}


function createMatrix() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.style.position =
        "fixed";

    canvas.style.left =
        "0";

    canvas.style.top =
        "0";

    canvas.style.width =
        "100%";

    canvas.style.height =
        "100%";

    canvas.style.zIndex =
        "-1";

    canvas.style.pointerEvents =
        "none";


    document.body.appendChild(
        canvas
    );


    const context =
        canvas.getContext("2d");


    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;


    const characters =
        "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    const size = 15;


    const columns =
        Math.floor(
            canvas.width / size
        );


    const drops =
        Array(columns).fill(1);


    let frames = 0;


    function draw() {

        context.fillStyle =
            "rgba(0,0,0,0.08)";


        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        context.fillStyle =
            "#00ff55";

        context.font =
            size +
            "px monospace";


        for (
            let i = 0;
            i < drops.length;
            i++
        ) {

            const character =
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ];


            context.fillText(

                character,

                i * size,

                drops[i] * size

            );


            if (

                drops[i] * size >
                canvas.height &&

                Math.random() > .975

            ) {

                drops[i] = 0;
            }


            drops[i]++;
        }


        frames++;


        if (frames < 250) {

            requestAnimationFrame(
                draw
            );

        } else {

            canvas.remove();
        }
    }


    draw();
}


input.addEventListener(
    "keydown",
    async event => {

        if (event.key === "Enter") {

            const value =
                input.value;


            input.value = "";


            await runCommand(
                value
            );


            screen.scrollTop =
                screen.scrollHeight;


            return;
        }


        if (event.key === "ArrowUp") {

            event.preventDefault();


            if (
                commandHistory.length
            ) {

                historyIndex =
                    Math.max(
                        0,
                        historyIndex - 1
                    );


                input.value =
                    commandHistory[
                        historyIndex
                    ] || "";
            }


            return;
        }


        if (event.key === "ArrowDown") {

            event.preventDefault();


            if (
                commandHistory.length
            ) {

                historyIndex =
                    Math.min(
                        commandHistory.length,
                        historyIndex + 1
                    );


                input.value =
                    commandHistory[
                        historyIndex
                    ] || "";
            }


            return;
        }


        if (event.key === "Tab") {

            event.preventDefault();


            const typed =
                input.value.toLowerCase();


            const matches =
                Object.keys(commands)
                    .filter(
                        command =>
                            command.startsWith(
                                typed
                            )
                    );


            if (
                matches.length === 1
            ) {

                input.value =
                    matches[0];
            }
        }

    }
);
