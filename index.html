<script>
(function() {
  // Function to set or update viewport meta tag
  function ensureViewportMeta() {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    
    if (!viewportMeta) {
      // Create viewport meta tag if it doesn't exist
      viewportMeta = document.createElement('meta');
      viewportMeta.name = 'viewport';
      document.head.insertBefore(viewportMeta, document.head.firstChild);
    }
    
    // Set viewport to prevent iOS auto-zoom
    // width=device-width: Use device width
    // initial-scale=1.0: Initial zoom level
    // maximum-scale=1.0: Prevent zooming beyond 1.0
    // user-scalable=no: Disable user scaling (prevents pinch zoom and auto-zoom on input focus)
    viewportMeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
  }
  
  // Run immediately if DOM is already ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ensureViewportMeta);
  } else {
    ensureViewportMeta();
  }
  
  // Also ensure it's set when head is ready (in case script runs before head)
  if (!document.head) {
    var observer = new MutationObserver(function(mutations) {
      if (document.head) {
        ensureViewportMeta();
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true });
  }
})();
</script>

<script>
(function() {
  var originalAddEventListener = EventTarget.prototype.addEventListener;
  var originalRemoveEventListener = EventTarget.prototype.removeEventListener;

  // ── Tap vs Swipe detection ──
  // Track pointerdown position; only synthesize click when displacement is small.
  var ptrDownPos = null;
  var TAP_THRESHOLD_SQ = 100; // 10px squared

  originalAddEventListener.call(document, 'pointerdown', function(e) {
    if (e.button !== 0) return;
    ptrDownPos = { x: e.clientX, y: e.clientY };
  }, { capture: true, passive: true });

  function isTap(e) {
    if (!ptrDownPos) return true; // no pointerdown recorded — be safe, treat as tap
    var dx = e.clientX - ptrDownPos.x;
    var dy = e.clientY - ptrDownPos.y;
    return (dx * dx + dy * dy) <= TAP_THRESHOLD_SQ;
  }

  // ── click → pointerup conversion ──
  var listenerMap = new WeakMap();

  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (type === 'click' && typeof listener === 'function') {
      var elementMap = listenerMap.get(this);
      if (!elementMap) {
        elementMap = new Map();
        listenerMap.set(this, elementMap);
      }

      var existingPointerListener = elementMap.get(listener);
      if (existingPointerListener) {
        return originalAddEventListener.call(this, 'pointerup', existingPointerListener, options);
      }

      var pointerupListener = function(e) {
        if (e.button !== 0) return;
        if (!isTap(e)) return;

        var clickEvent = new MouseEvent('click', {
          bubbles: e.bubbles, cancelable: e.cancelable, view: e.view,
          detail: 1,
          screenX: e.screenX, screenY: e.screenY,
          clientX: e.clientX, clientY: e.clientY,
          ctrlKey: e.ctrlKey, altKey: e.altKey,
          shiftKey: e.shiftKey, metaKey: e.metaKey,
          button: e.button, relatedTarget: e.relatedTarget
        });
        Object.defineProperty(clickEvent, 'target', { value: e.target, enumerable: true });
        Object.defineProperty(clickEvent, 'currentTarget', { value: e.currentTarget, enumerable: true });

        try { listener.call(this, clickEvent); } catch (err) {}
      };

      elementMap.set(listener, pointerupListener);
      return originalAddEventListener.call(this, 'pointerup', pointerupListener, options);
    }

    return originalAddEventListener.call(this, type, listener, options);
  };

  EventTarget.prototype.removeEventListener = function(type, listener, options) {
    if (type === 'click' && typeof listener === 'function') {
      var elementMap = listenerMap.get(this);
      if (elementMap) {
        var pointerupListener = elementMap.get(listener);
        if (pointerupListener) {
          elementMap.delete(listener);
          return originalRemoveEventListener.call(this, 'pointerup', pointerupListener, options);
        }
      }
    }
    return originalRemoveEventListener.call(this, type, listener, options);
  };

  // ── Synthetic click for .onclick compatibility ──
  // Only dispatch when the gesture is a tap (not a swipe).
  var SEKAI_SYNTHETIC_KEY = '__sekai_sc';

  originalAddEventListener.call(document, 'pointerup', function(e) {
    if (e.button !== 0) return;
    if (!isTap(e)) return;
    var t = e.target;
    if (!t || !t.dispatchEvent) return;

    var evt = new MouseEvent('click', {
      bubbles: true, cancelable: true, view: e.view,
      detail: 1,
      screenX: e.screenX, screenY: e.screenY,
      clientX: e.clientX, clientY: e.clientY,
      ctrlKey: e.ctrlKey, altKey: e.altKey,
      shiftKey: e.shiftKey, metaKey: e.metaKey,
      button: 0, relatedTarget: null
    });
    Object.defineProperty(evt, SEKAI_SYNTHETIC_KEY, { value: true });
    t.dispatchEvent(evt);
  }, false);

  // Block browser-synthesized click events to prevent double-triggering.
  originalAddEventListener.call(document, 'click', function(e) {
    if (!e[SEKAI_SYNTHETIC_KEY]) {
      e.stopImmediatePropagation();
    }
  }, true);
})();
</script>

<script>
(function() {
  // Track recent touch to block emulated mouse events
  var lastTouchTime = 0;
  var TOUCH_MOUSE_DELAY = 200; // ms to block mouse events after touch

  // Global touch tracker - set flag when touch occurs
  document.addEventListener('touchstart', function() {
    lastTouchTime = Date.now();
  }, { passive: true, capture: true });

  document.addEventListener('touchend', function() {
    lastTouchTime = Date.now();
  }, { passive: true, capture: true });

  // Block emulated mouse events that follow touch
  // BUT allow them on focusable elements (inputs need mousedown for focus)
  function blockEmulatedMouseHandler(e) {
    if (Date.now() - lastTouchTime < TOUCH_MOUSE_DELAY) {
      // Don't block on focusable elements - they need mousedown for focus
      var target = e.target;
      if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) {
        return; // Allow the event
      }
      e.stopPropagation();
      // NOTE: Do NOT call preventDefault() here.
      // CSS user-select:none already handles text selection prevention.
      // On iOS WKWebView, mousedown.preventDefault() can intermittently
      // suppress click event synthesis, breaking .onclick handlers.
    }
  }

  // Capture phase blockers for emulated mouse events
  document.addEventListener('mousedown', blockEmulatedMouseHandler, { capture: true });

  // Patch addEventListener to force passive on touch events.
  // Expose original globally so SCROLL_BLOCK_SCRIPT can register a
  // non-passive touchmove handler to block iOS WKWebView parent scroll.
  var originalAddEventListener = EventTarget.prototype.addEventListener;
  window.__sekai_orig_ael = originalAddEventListener;

  EventTarget.prototype.addEventListener = function(type, listener, options) {
    // Convert touchstart/touchmove to passive
    // Mouse event emulation is handled by our global blockers above
    if (type === 'touchstart' || type === 'touchmove') {
      var newOptions = Object.assign({}, options || {}, { passive: true });
      return originalAddEventListener.call(this, type, listener, newOptions);
    }
    return originalAddEventListener.call(this, type, listener, options);
  };
})();
</script>

<script>
(function() {
  // Track if dom_ready was already sent
  var domReadySent = false;

  function sendDomReady() {
    if (domReadySent) return;
    domReadySent = true;
    window.parent.postMessage({ type: 'sekai_iframe_dom_ready' }, '*');
  }

  // Send dom_ready when DOMContentLoaded fires
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sendDomReady);
  } else {
    // DOM already loaded
    sendDomReady();
  }

  // Helper to serialize message - handles objects that would become [object Object]
  function serializeMessage(msg) {
    if (msg === null || msg === undefined) return '';
    if (typeof msg === 'string') return msg;
    if (typeof msg === 'object') {
      try {
        return JSON.stringify(msg);
      } catch (e) {
        return String(msg);
      }
    }
    return String(msg);
  }

  // Catch JS errors and send to parent
  window.onerror = function(message, source, lineno, colno, error) {
    window.parent.postMessage({
      type: 'sekai_iframe_js_error',
      message: serializeMessage(message),
      source: source || '',
      lineno: lineno || 0,
      colno: colno || 0,
      errorName: error ? error.name : '',
      errorStack: error ? error.stack : ''
    }, '*');
    // Return false to allow default error handling
    return false;
  };

  // Also catch unhandled promise rejections
  window.addEventListener('unhandledrejection', function(event) {
    var reason = event.reason;
    var isError = reason instanceof Error;
    window.parent.postMessage({
      type: 'sekai_iframe_js_error',
      message: reason ? serializeMessage(reason) : 'Unhandled promise rejection',
      source: 'unhandledrejection',
      lineno: 0,
      colno: 0,
      errorName: isError ? reason.name : '',
      errorStack: isError ? reason.stack : ''
    }, '*');
  });
})();
</script>

<script>
(function() {
  // Collect all devicemotion listeners registered by game code
  var deviceMotionListeners = [];

  // Save original addEventListener
  var originalAddEventListener = window.addEventListener;

  // Intercept addEventListener to capture devicemotion listeners
  window.addEventListener = function(type, listener, options) {
    if (type === 'devicemotion' && typeof listener === 'function') {
      deviceMotionListeners.push(listener);
      // Also add to native in case permission is granted elsewhere
      return originalAddEventListener.call(this, type, listener, options);
    }
    return originalAddEventListener.call(this, type, listener, options);
  };

  // Also intercept removeEventListener
  var originalRemoveEventListener = window.removeEventListener;
  window.removeEventListener = function(type, listener, options) {
    if (type === 'devicemotion' && typeof listener === 'function') {
      var index = deviceMotionListeners.indexOf(listener);
      if (index !== -1) {
        deviceMotionListeners.splice(index, 1);
      }
    }
    return originalRemoveEventListener.call(this, type, listener, options);
  };

  // Listen for forwarded motion data from parent
  window.addEventListener('message', function(event) {
    if (!event.data || event.data.type !== '__sekai_device_motion__') return;

    var data = event.data;

    // Create a synthetic event-like object
    var syntheticEvent = {
      accelerationIncludingGravity: data.accelerationIncludingGravity,
      acceleration: data.acceleration,
      rotationRate: data.rotationRate,
      interval: data.interval || 16,
      // Make it look like a real event
      type: 'devicemotion',
      timeStamp: data.timestamp || Date.now(),
      target: window,
      currentTarget: window,
      preventDefault: function() {},
      stopPropagation: function() {},
      stopImmediatePropagation: function() {}
    };

    // Trigger all registered listeners
    deviceMotionListeners.forEach(function(listener) {
      try {
        listener(syntheticEvent);
      } catch (e) {
        // Ignore listener errors
      }
    });
  });
})();
</script>

<script>
(function() {
  // Track all AudioContexts created in this iframe
  var audioContexts = [];
  var originalAudioContext = window.AudioContext || window.webkitAudioContext;

  if (originalAudioContext) {
    // Patch AudioContext constructor to track instances and enforce initial mute state.
    // If isMuted is true when the context is created, suspend it immediately so that
    // AudioNode sources cannot produce audio before the parent sends receive_audio_mute.
    // This closes the race window between iframe load start and the first mute message.
    var PatchedAudioContext = function() {
      var ctx = new originalAudioContext();
      audioContexts.push(ctx);
      // Per-ctx diagnostic flags. Each AudioContext instance warns at most
      // once for each of the two diagnostics below, so a rAF-driven
      // resume() loop (observed in real games) does not spam vconsole,
      // while new contexts still act as fresh sentinels.
      var resumeBlockWarned = false;
      var browserResumeWarned = false;
      if (typeof ctx.resume === 'function') {
        var originalCtxResume = ctx.resume.bind(ctx);
        ctx.resume = function() {
          if (isMuted) {
            // Game code attempted to resume AudioContext during mute window.
            // Blocked here prevents the audibility observer from reporting a
            // false playing_started. Logged once per ctx to confirm the
            // "game code calls resume()" leak path is real.
            if (!resumeBlockWarned) {
              resumeBlockWarned = true;
              try {
                console.warn(
                  '[sekai-iframe-audio] AudioContext.resume() blocked while muted (once per ctx)'
                );
              } catch (e) {}
            }
            return Promise.resolve();
          }
          return originalCtxResume();
        };
      }
      if (isMuted) {
        ctx.suspend().catch(function() {});
      }
      // Feed perf audibility observer: re-evaluate whenever the context
      // transitions between suspended/running/closed. ctx.suspend()/resume()
      // resolve asynchronously, so the statechange event is the only reliable
      // signal that the context has actually moved.
      try {
        ctx.addEventListener('statechange', function() {
          // Sentinel: resume() is blocked above while muted, so if the ctx
          // still enters 'running' during mute, the only remaining cause is
          // browser-initiated state recovery (e.g. iOS audio session
          // interruption ending). If this log ever appears in practice, the
          // resume() block alone is not enough — we must also guard
          // notifyAudibilityChange() to suppress audible=true while muted.
          // Logged once per ctx to avoid repeated warnings on oscillating
          // state transitions.
          if (ctx.state === 'running' && isMuted && !browserResumeWarned) {
            browserResumeWarned = true;
            try {
              console.warn(
                '[sekai-iframe-audio] AudioContext entered running while muted (browser-initiated, once per ctx)'
              );
            } catch (e) {}
          }
          scheduleAudibilityCheck();
        });
      } catch (e) {

      }
      return ctx;
    };

    window.AudioContext = PatchedAudioContext;
    if (window.webkitAudioContext) {
      window.webkitAudioContext = PatchedAudioContext;
    }

  var audioElements = [];
  var originalAudio = window.Audio;

    if (!el) return;
    try {

        mutedElements.set(el, !!el.muted);
      }
    } catch (e) {
      // Ignore muted state snapshot failures
    }

    window.Audio = function(src) {
      var audio = new originalAudio(src);
      audioElements.push(audio);
      if (isMuted) {
        rememberMutedState(audio);
        try { audio.muted = true; } catch (e) {}
      }
      return audio;
    };

    window.Audio.prototype = originalAudio.prototype;
  }

  var videoElements = [];
  var originalCreateElement = document.createElement;

  document.createElement = function(tagName) {
    var element = originalCreateElement.call(document, tagName);

    // Track audio and video elements

      var tag = tagName.toLowerCase();

        audioElements.push(element);
        if (isMuted) {
          rememberMutedState(element);
          try { element.muted = true; } catch (e) {}
        }
      } else if (tag === 'video') {
        videoElements.push(element);
        if (isMuted) {
          rememberMutedState(element);
          try { element.muted = true; } catch (e) {}
        }
      }
    }

    return element;
  };

  // Track elements that are INTENDED to be playing (based on .play()/.pause() calls).
  // This is more reliable than checking .paused at mute time, because iOS pauses
  // audio elements when the app goes to background BEFORE our JS visibility handler
  // runs — by the time muteAllAudio() is called, all elements are already paused
  // by the OS and .paused === true for all of them.
  var intendedPlaying = new Set();

  if (window.HTMLMediaElement) {
    var originalHTMLPlay = HTMLMediaElement.prototype.play;
    var originalHTMLPause = HTMLMediaElement.prototype.pause;
    var internalPause = false;

    HTMLMediaElement.prototype.play = function() {

      if (isMuted) {
        rememberMutedState(this);
        try { this.muted = true; } catch (e) {}
        try {
          if (!this.paused) {
            internalPause = true;
            originalHTMLPause.call(this);
          }

          internalPause = false;
        }
        return Promise.resolve();

      return originalHTMLPlay.apply(this, arguments);

  // until all elements are playing again. More reliable than { once: true } because
  // it survives cases where the first touch fires before unmuteAllAudio() processes
  // the message (postMessage is async; user may touch the moment they switch back).
  var pendingResume = [];

  var isMuted = false;

    var elements = [];

      seen.add(el);
      elements.push(el);

    audioElements.forEach(pushElement);
    videoElements.forEach(pushElement);

      el.pause();
    } finally {

    if (!el) return;
    rememberMutedState(el);

    if (isMuted) return;
    isMuted = true;
    pendingResume = []; // Clear queued resumes — new mute cycle resets state

    // Suspend all AudioContexts
    audioContexts.forEach(function(ctx) {
      if (ctx && ctx.state === 'running') {
        ctx.suspend().catch(function() {});
      }

    // Pause first, then force mute so background playback cannot leak audio.
    // The audibility observer below will automatically emit
    // sekai_iframe_audio_playing_stopped once the pause/mute propagates, so
    // we no longer post a separate sekai_iframe_audio_muted confirmation.
    collectTrackedMediaElements().forEach(function(el) {
      try {
        lockElementAudio(el);
      } catch (e) {
        // Element might be stale or invalid
      }
    });

  function resumeAllContexts() {
    audioContexts.forEach(function(ctx) {
      // Call resume() on any non-closed context, including 'running'.
      // Reason: muteAllAudio() calls ctx.suspend(), which is async. If
      // unmuteAllAudio() (or a touchstart retry) runs before suspend() resolves,
      // ctx.state is still 'running' — the old suspended/interrupted-only guard
      // would skip it, then suspend() resolves and the context stays permanently
      // suspended. By calling resume() on 'running' contexts too, we queue a
      // resume after the pending suspend, so both operations execute in order
      // (suspend → resume) and the context ends up running as intended.
      // resume() on an already-running context is a no-op per the Web Audio spec.
      if (ctx && ctx.state !== 'closed') {
        ctx.resume().catch(function() {});
      }
    });

  function unmuteAllAudio() {
    if (!isMuted) return;
    isMuted = false;

    // Resume all AudioContexts immediately (handles 'suspended' and 'interrupted')
    resumeAllContexts();

    // Restore tracked media elements to their original muted state.
    collectTrackedMediaElements().forEach(function(el) {
      var wasMuted = mutedElements.get(el);
      if (wasMuted !== undefined) {
        el.muted = wasMuted;
      } else {
        el.muted = false;
      }
    });
    mutedElements = new WeakMap();

    // Queue intended elements for playback resume.
    // iOS pauses audio/video elements on app-switch before our JS handler runs,
    // so simply unmuting is not enough — we must call .play() to restore.
    // We populate pendingResume here; the persistent touchstart listener below
    // retries on every user touch until all elements are playing again.
    pendingResume = [];
    intendedPlaying.forEach(function(el) {
      if (!el || el.ended) return;
      pendingResume.push(el);
    });
    // Also attempt immediately — succeeds on iOS versions / audio session states
    // that allow .play() without a fresh user gesture.
    pendingResume.forEach(function(el) {
      try { if (el.paused) el.play().catch(function() {}); } catch(e) {}

  // Retries AudioContext resume and HTML5 element .play() until all succeed.
  // Registered once at script init using capture phase so game code stopPropagation
  // cannot prevent it from running.
  //

  // - postMessage delivery is async; the user may touch before unmuteAllAudio()
  //   processes the receive_audio_unmute message, consuming a { once: true } slot
  // - iOS may reject .play() on the first attempt but allow it on subsequent ones
  document.addEventListener('touchstart', function() {
    if (isMuted) return;
    // Retry AudioContexts on every touch (handles 'interrupted' / 'suspended')

    // Retry HTML5 elements still waiting to resume
    if (pendingResume.length === 0) return;
    var toTry = pendingResume;
    pendingResume = [];
    toTry.forEach(function(el) {
      try {
        if (!el.paused) return; // Already playing — no action needed
        el.play().catch(function() {
          pendingResume.push(el); // Failed — retry on next touch

      } catch(e) {
        pendingResume.push(el);
      }

    if (!node || node.nodeType !== 1) return [];
    var elements = [];
    if (node.tagName === 'AUDIO' || node.tagName === 'VIDEO') {
      elements.push(node);

    if (typeof node.querySelectorAll === 'function') {
      node.querySelectorAll('audio, video').forEach(function(el) {
        elements.push(el);
      });
    }

    var target = event.target;
    if (!target || typeof target.pause !== 'function') return;
    lockElementAudio(target);

  //   - Based on real <audio>/<video> element state and AudioContext state
  //   - Not based on parent mute/unmute commands (those only state intent)
  //

  //   - "should have played but didn't" — card visible, no start event
  //   - "played after it shouldn't" — audio duration > card visible duration
  // Both failure modes are invisible from the parent side alone.
  //
  // Multi-cycle per card is supported naturally: every mute/unmute/tab

      if (vol <= 0) return false;
      return true;
    } catch (e) {
      return false;
    }

      const MODEL_BACKROOMS = getConfig('models', 'user-model-1-backrooms_vr');
      const MUSIC_QUOTE_1 = getConfig('music', 'user-music-1-verity_quote_1-mp3-mpeg');
      const MUSIC_REAL_VERITY = getConfig('music', 'user-music-2-i-am-the-real-verity-made-w');
      const MUSIC_VOICE_VERITY = getConfig('music', 'user-music-3-voice-verity-verity');
      const MUSIC_REVEAL_SELF = getConfig('music', 'user-music-4-verity_revealself');

      // App Global State
      const state = {
        phase: 'menu', // 'menu' | 'sim'
        isSqueezing: false,
        isSqueezingFromMouse: false,
        currentPlayingAudio: null,
        mousePinchPoint: null,
        draggingHandIndex: -1, // -1 if not dragging, 0 for left hand/controller, 1 for right hand/controller, 2 for mouse
        dragOffset: new THREE.Vector3(),
        homePosition: new THREE.Vector3(0, 0, 0),
        grabActive: false,
        localGrabPoints: {},
        worldGrabPoint: new THREE.Vector3(),
        currentHandWorldPos: new THREE.Vector3()
      };

      // Track pinch states for VR hands
      const vrPinchStates = [
        { active: false, prevWorldPos: new THREE.Vector3() },
        { active: false, prevWorldPos: new THREE.Vector3() }
      ];

      // Track pinch state for mouse
      const mousePinchState = {
        active: false,
        prevWorldPos: new THREE.Vector3()
      };

      window.appState = state; // expose for inspection

      // Sound Player Helper
      function playAudio(key, url) {
        vibrate(40);
        if (state.currentPlayingAudio) {
          try {
            state.currentPlayingAudio.pause();
            state.currentPlayingAudio.currentTime = 0;
          } catch(e) {}
        }
        if (url) {
          const audio = new Audio(url);
          state.currentPlayingAudio = audio;
          audio.play().catch(err => {
            console.log('Audio playback fallback WebAudio Synth', err);
            synthBeep(440, 150);
          });
        } else {
          synthBeep(440, 150);
        }
      }

      function synthBeep(freq = 440, durationMs = 100) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = freq;
          gain.gain.value = 0.15;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          setTimeout(() => {
            osc.stop();
            ctx.close();
          }, durationMs);
        } catch(e) {}
      }

      // Three.js Interactive XR & Verity Squeeze Simulator
      let scene, camera, renderer;
      let playerGroup;
      let verityGroup, verityMesh;
      let hand1, hand2;
      let handModel1, handModel2;
      let controller1, controller2;
      let controllerGrip1, controllerGrip2;
      let threeInitialized = false;
      const deformableMeshes = [];
      const backroomsColliders = [];

      function createControllerHandMesh() {
        const handGroup = new THREE.Group();
        const palmMat = new THREE.MeshStandardMaterial({
          color: 0x000000, // pitch black
          roughness: 0.9,
          metalness: 0.1
        });
        
        // Palm
        const palm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.08), palmMat);
        palm.position.set(0, 0, -0.03);
        handGroup.add(palm);
        
        // Fingers (fist-like)
        const fingers = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.03, 0.04), palmMat);
        fingers.position.set(0, 0, -0.08);
        handGroup.add(fingers);
        
        // Thumb
        const thumb = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 0.03), palmMat);
        thumb.position.set(-0.03, 0.01, -0.04);
        handGroup.add(thumb);
        
        handGroup.traverse(c => {
          if (c.isMesh) {
            c.castShadow = true;
            c.receiveShadow = true;
          }
        });
        return handGroup;
      }

      function initThreeJS() {
        if (threeInitialized) return;
        threeInitialized = true;
        const container = document.getElementById('sim-viewport');
        const canvas = document.getElementById('three-canvas');
        if (!container || !canvas) return;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);

        playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 3.2);
        scene.add(playerGroup);
        playerGroup.add(camera);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Enable WebXR
        renderer.xr.enabled = true;

        // Realistic Day Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xd0e0fc, 1.0);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        // Build Procedural 3D Verity Entity (fallback sphere)
        verityGroup = new THREE.Group();

        const orbGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const orbMat = new THREE.MeshStandardMaterial({
          color: 0x0066ff,
          emissive: 0x002266,
          roughness: 0.2,
          metalness: 0.8
        });
        verityMesh = new THREE.Mesh(orbGeo, orbMat);
        verityGroup.add(verityMesh);

        // Make procedural sphere deformable too!
        verityMesh.userData.originalPosition = verityMesh.geometry.attributes.position.clone();
        const count = verityMesh.geometry.attributes.position.count;
        verityMesh.userData.velocities = new Float32Array(count * 3);
        verityMesh.userData.displacements = new Float32Array(count * 3);
        deformableMeshes.push(verityMesh);

        // Verity Inner Pulsing Core
        const innerGeo = new THREE.IcosahedronGeometry(0.2, 2);
        const innerMat = new THREE.MeshBasicMaterial({
          color: 0x00ff66,
          wireframe: true,
          transparent: true,
          opacity: 0.7
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        verityMesh.add(innerMesh);

        scene.add(verityGroup);

        // Load GLTF model
        loadVerityModel();

        // Load Backrooms model
        loadBackroomsModel();

        // Setup WebXR Hands
        const handModelFactory = new XRHandModelFactory();

        hand1 = renderer.xr.getHand(0);
        playerGroup.add(hand1);
        handModel1 = handModelFactory.createHandModel(hand1, 'mesh');
        hand1.add(handModel1);

        hand2 = renderer.xr.getHand(1);
        playerGroup.add(hand2);
        handModel2 = handModelFactory.createHandModel(hand2, 'mesh');
        hand2.add(handModel2);

        controller1 = renderer.xr.getController(0);
        playerGroup.add(controller1);
        controller2 = renderer.xr.getController(1);
        playerGroup.add(controller2);

        controllerGrip1 = renderer.xr.getControllerGrip(0);
        playerGroup.add(controllerGrip1);
        const controllerHand1 = createControllerHandMesh();
        controllerGrip1.add(controllerHand1);

        controllerGrip2 = renderer.xr.getControllerGrip(1);
        playerGroup.add(controllerGrip2);
        const controllerHand2 = createControllerHandMesh();
        controllerHand2.scale.x = -1; // Mirror for right hand
        controllerGrip2.add(controllerHand2);

        // Grid Helper for VR mode
        const gridHelper = new THREE.GridHelper(10, 10, 0x0066ff, 0x222222);
        gridHelper.position.y = -1;
        scene.add(gridHelper);

        // Handle WebXR session events
        renderer.xr.addEventListener('sessionstart', () => {
          state.homePosition.set(0, 1.2, -0.5);
          verityGroup.position.copy(state.homePosition);
          gridHelper.visible = false;

          const session = renderer.xr.getSession();
          if (session.environmentBlendMode === 'alpha-blend' || session.environmentBlendMode === 'additive') {
            scene.background = null;
          } else {
            scene.background = new THREE.Color(0x87CEEB);
          }
        });

        renderer.xr.addEventListener('sessionend', () => {
          state.homePosition.set(0, 0, 0);
          playerGroup.position.set(0, 0, 3.2);
          playerGroup.rotation.set(0, 0, 0);
          scene.background = new THREE.Color(0x87CEEB);
        });

        function checkCollision(headPos) {
          if (backroomsColliders.length === 0) return false;
          const raycaster = new THREE.Raycaster();
          const directions = [
            new THREE.Vector3(1, 0, 0),
            new THREE.Vector3(-1, 0, 0),
            new THREE.Vector3(0, 0, 1),
            new THREE.Vector3(0, 0, -1)
          ];
          const startPos = headPos.clone();
          startPos.y = 0.8;
          for (const dir of directions) {
            raycaster.set(startPos, dir);
            raycaster.far = 0.4;
            const intersects = raycaster.intersectObjects(backroomsColliders, true);
            if (intersects.length > 0) {
              return true;
            }
          }
          return false;
        }

        // Animation Loop
        let clock = new THREE.Clock();
        renderer.setAnimationLoop(() => {
          const dt = Math.min(clock.getDelta(), 0.03);
          const elapsedTime = clock.getElapsedTime();

          // Locomotion via Gamepad
          const session = renderer.xr.getSession();
          if (session) {
            let controller1Active = false;
            let controller2Active = false;
            for (const source of session.inputSources) {
              if (source.targetRayMode === 'tracked-pointer') {
                if (source.handedness === 'left') controller1Active = true;
                if (source.handedness === 'right') controller2Active = true;
              }
              if (source.gamepad) {
                const axes = source.gamepad.axes;
                if (source.handedness === 'left') {
                  const x = axes[2] || 0;
                  const z = axes[3] || 0;
                  if (Math.abs(x) > 0.1 || Math.abs(z) > 0.1) {
                    const headWorldPos = new THREE.Vector3();
                    camera.getWorldPosition(headWorldPos);

                    const camDir = new THREE.Vector3();
                    camera.getWorldDirection(camDir);
                    camDir.y = 0;
                    camDir.normalize();
                    const camRight = new THREE.Vector3();
                    camRight.crossVectors(camera.up, camDir).normalize().negate();
                    const moveVec = new THREE.Vector3()
                      .addScaledVector(camDir, -z)
                      .addScaledVector(camRight, x)
                      .multiplyScalar(dt * 2.0);
                    
                    const nextHeadPos = headWorldPos.clone().add(moveVec);
                    if (!checkCollision(nextHeadPos)) {
                      playerGroup.position.add(moveVec);
                    }
                  }
                }
                if (source.handedness === 'right') {
                  const x = axes[2] || 0;
                  if (Math.abs(x) > 0.1) {
                    const headWorldPos = new THREE.Vector3();
                    camera.getWorldPosition(headWorldPos);

                    playerGroup.rotation.y -= x * dt * 1.5;

                    const newHeadWorldPos = new THREE.Vector3();
                    camera.getWorldPosition(newHeadWorldPos);
                    const diff = new THREE.Vector3().subVectors(headWorldPos, newHeadWorldPos);
                    playerGroup.position.add(diff);
                  }
                }
              }
            }

            // Update controller hand visibility
            if (controllerGrip1) {
              controllerGrip1.visible = (hand1 && hand1.visible) ? false : controller1Active;
            }
            if (controllerGrip2) {
              controllerGrip2.visible = (hand2 && hand2.visible) ? false : controller2Active;
            }
          }

          // Continuous physical collision resolution based on head position
          const currentHeadPos = new THREE.Vector3();
          camera.getWorldPosition(currentHeadPos);
          if (checkCollision(currentHeadPos)) {
            const raycaster = new THREE.Raycaster();
            const directions = [
              { dir: new THREE.Vector3(1, 0, 0), opp: new THREE.Vector3(-1, 0, 0) },
              { dir: new THREE.Vector3(-1, 0, 0), opp: new THREE.Vector3(1, 0, 0) },
              { dir: new THREE.Vector3(0, 0, 1), opp: new THREE.Vector3(0, 0, -1) },
              { dir: new THREE.Vector3(0, 0, -1), opp: new THREE.Vector3(0, 0, 1) }
            ];
            const startPos = currentHeadPos.clone();
            startPos.y = 0.8;
            let pushVec = new THREE.Vector3();
            for (const d of directions) {
              raycaster.set(startPos, d.dir);
              raycaster.far = 0.4;
              const intersects = raycaster.intersectObjects(backroomsColliders, true);
              if (intersects.length > 0) {
                const overlap = 0.4 - intersects[0].distance;
                pushVec.addScaledVector(d.opp, overlap);
              }
            }
            if (pushVec.lengthSq() > 0) {
              playerGroup.position.add(pushVec);
            }
          }

          // Float animation for Verity
          if (verityGroup) {
            const floatY = Math.sin(elapsedTime * 1.8) * 0.05;
            verityGroup.position.copy(state.homePosition);
            verityGroup.position.y += floatY;
            if (innerMesh) innerMesh.rotation.y += 0.01;

            // Always stare at you (camera)
            const target = new THREE.Vector3();
            if (renderer.xr.isPresenting) {
              const xrCamera = renderer.xr.getCamera();
              xrCamera.getWorldPosition(target);
            } else {
              camera.getWorldPosition(target);
            }
            
            // Smoothly look at the camera
            const currentRotation = verityGroup.quaternion.clone();
            verityGroup.lookAt(target);
         
             // Apply rotation offset (read live from config)
             const offsetNormalized = getConfig('tune', 'verity-rotation-offset-normalized', 0.0);
              const offsetDeg = offsetNormalized * 360 - 90;
             verityGroup.rotateY((offsetDeg * Math.PI) / 180);
          
            const targetRotation = verityGroup.quaternion.clone();
            verityGroup.quaternion.copy(currentRotation).slerp(targetRotation, 0.05);
          }

          // Unified Pinch/Grab and Drag State Machine
          let activePinchPos = null;
          let activePinchIndex = -1; // 0 = left, 1 = right, 2 = mouse

          // Check VR Hands
          [hand1, hand2].forEach((hand, index) => {
            if (hand && hand.visible) {
              const indexTip = hand.joints['index-finger-tip'];
              const thumbTip = hand.joints['thumb-tip'];
              if (indexTip && thumbTip) {
                const indexPos = new THREE.Vector3();
                const thumbPos = new THREE.Vector3();
                indexTip.getWorldPosition(indexPos);
                thumbTip.getWorldPosition(thumbPos);
                
                const pinchDist = indexPos.distanceTo(thumbPos);
                if (pinchDist < 0.05) {
                  activePinchPos = new THREE.Vector3().addVectors(indexPos, thumbPos).multiplyScalar(0.5);
                  activePinchIndex = index;
                }
              }
            }
          });

          // Check VR Controllers (if hand tracking is not active for that hand)
          if (activePinchPos === null && session) {
            for (const source of session.inputSources) {
              if (source.gamepad && source.targetRayMode === 'tracked-pointer') {
                const gamepad = source.gamepad;
                const triggerButton = gamepad.buttons[0];
                const squeezeButton = gamepad.buttons[1];
                const isPressed = (triggerButton && triggerButton.pressed) || (squeezeButton && squeezeButton.pressed);
                
                const index = source.handedness === 'left' ? 0 : 1;
                const hand = index === 0 ? hand1 : hand2;
                if (hand && hand.visible) continue; // Hand tracking takes priority
                
                if (isPressed) {
                  const grip = index === 0 ? controllerGrip1 : controllerGrip2;
                  if (grip) {
                    activePinchPos = new THREE.Vector3();
                    grip.getWorldPosition(activePinchPos);
                    activePinchIndex = index;
                  }
                }
              }
            }
          }

          // Check Mouse
          if (activePinchPos === null && mousePinchState.active) {
            activePinchPos = state.mousePinchPoint;
            activePinchIndex = 2;
          }

          // Update dragging state
          if (activePinchPos !== null) {
            const ballPos = new THREE.Vector3();
            verityGroup.getWorldPosition(ballPos);
            const distToBall = activePinchPos.distanceTo(ballPos);

            if (state.draggingHandIndex === -1) {
              // Start dragging if close enough
              if (distToBall < 0.6) {
                state.draggingHandIndex = activePinchIndex;
                state.dragOffset.copy(state.homePosition).sub(activePinchPos);
                
                // Trigger squeeze effect
                triggerSqueezeEffect();
                
                // Initialize prevWorldPos for deformation
                if (activePinchIndex === 2) {
                  mousePinchState.prevWorldPos.copy(activePinchPos);
                } else {
                  vrPinchStates[activePinchIndex].active = true;
                  vrPinchStates[activePinchIndex].prevWorldPos.copy(activePinchPos);
                }

                // Set up grab info for stretching
                state.grabActive = true;
                state.worldGrabPoint.copy(activePinchPos);
                state.currentHandWorldPos.copy(activePinchPos);
                
                // Compute local grab point for each deformable mesh
                state.localGrabPoints = {};
                deformableMeshes.forEach(mesh => {
                  const localPt = activePinchPos.clone();
                  mesh.worldToLocal(localPt);
                  state.localGrabPoints[mesh.uuid] = localPt;
                });
              }
            } else if (state.draggingHandIndex === activePinchIndex) {
               // Continue dragging (only stretch, do not move body position)
               state.currentHandWorldPos.copy(activePinchPos);
              
               // Calculate delta for deformation
              let prevWorldPos;
              if (activePinchIndex === 2) {
                prevWorldPos = mousePinchState.prevWorldPos;
              } else {
                prevWorldPos = vrPinchStates[activePinchIndex].prevWorldPos;
              }
              
              const delta = activePinchPos.clone().sub(prevWorldPos);
              applyDragDelta(activePinchPos, delta);
              
              prevWorldPos.copy(activePinchPos);
            }
          } else {
            // Stop dragging
            if (state.draggingHandIndex !== -1) {
              if (state.draggingHandIndex === 2) {
                mousePinchState.active = false;
              } else {
                vrPinchStates[state.draggingHandIndex].active = false;
              }
              state.draggingHandIndex = -1;
              state.grabActive = false;
            }
          }

          // Check WebXR squeeze
          updateSqueezeDetection();

          // Apply pitch black material to XR hands once loaded
          [handModel1, handModel2].forEach(model => {
            if (model && !model.hasBlackSkin) {
              let hasMesh = false;
              model.traverse(child => {
                if (child.isMesh) {
                  hasMesh = true;
                  child.material = new THREE.MeshStandardMaterial({
                    color: 0x000000, // pitch black
                    roughness: 0.9,
                    metalness: 0.1
                  });
                  child.castShadow = true;
                  child.receiveShadow = true;
                }
              });
              if (hasMesh) {
                model.hasBlackSkin = true;
              }
            }
          });

          // Soft body jelly deformation update
          // Get active push points (non-pinching hand joints)
          const pushPoints = [];

          [hand1, hand2].forEach((hand, index) => {
            const stateObj = vrPinchStates[index];
            if (hand && hand.visible) {
              // If this hand is pinching, we don't use its fingertips for pushing to avoid fighting the drag
              if (stateObj.active) return;
              
              const jointsToUse = [
                'wrist',
                'thumb-tip',
                'index-finger-tip',
                'middle-finger-tip',
                'ring-finger-tip',
                'pinky-finger-tip'
              ];
              jointsToUse.forEach(jointName => {
                const joint = hand.joints[jointName];
                if (joint) {
                  const jointPos = new THREE.Vector3();
                  joint.getWorldPosition(jointPos);
                  pushPoints.push(jointPos);
                }
              });
            }
          });

          // Add controller grip positions as push points if hand tracking is not active
          if (session) {
            [0, 1].forEach(index => {
              const hand = index === 0 ? hand1 : hand2;
              if (hand && hand.visible) return; // Hand tracking is active, so it handles pushing
              
              // If this controller is dragging, don't use it for pushing
              if (state.draggingHandIndex === index) return;
              
              const grip = index === 0 ? controllerGrip1 : controllerGrip2;
              if (grip && grip.visible) {
                const gripPos = new THREE.Vector3();
                grip.getWorldPosition(gripPos);
                pushPoints.push(gripPos);
              }
            });
          }

          // Update soft body physics for each deformable mesh
          deformableMeshes.forEach(mesh => {
            const posAttr = mesh.geometry.attributes.position;
            const origPosAttr = mesh.userData.originalPosition;
            const vels = mesh.userData.velocities;
            const disps = mesh.userData.displacements;
            
            if (!posAttr || !origPosAttr || !vels || !disps) return;
            
            const count = posAttr.count;
            
            // Transform push points to local space
            const localPushPoints = pushPoints.map(pt => {
              const localPt = pt.clone();
              mesh.worldToLocal(localPt);
              return localPt;
            });
            
            // Physics parameters for slime
            const springK = 80.0; // faster return to normal
            const damping = 8.0;  // higher damping to stabilize faster
            const pushForce = 30.0; // slightly less extreme deformation
            const pushRadius = 0.35; // tighter, more accurate hitbox
            
            let localGrabPt = null;
            let localHandPt = null;
            if (state.grabActive && state.localGrabPoints[mesh.uuid]) {
              localGrabPt = state.localGrabPoints[mesh.uuid];
              localHandPt = state.currentHandWorldPos.clone();
              mesh.worldToLocal(localHandPt);
            }
            
            for (let i = 0; i < count; i++) {
              const ox = origPosAttr.getX(i);
              const oy = origPosAttr.getY(i);
              const oz = origPosAttr.getZ(i);
              
              let dx = disps[i * 3];
              let dy = disps[i * 3 + 1];
              let dz = disps[i * 3 + 2];
              
              let vx = vels[i * 3];
              let vy = vels[i * 3 + 1];
              let vz = vels[i * 3 + 2];
              
              // Current local position of the vertex
              const lx = ox + dx;
              const ly = oy + dy;
              const lz = oz + dz;
              
              // 1. Spring force returning to original position (or stretched position)
              let targetStretchX = 0;
              let targetStretchY = 0;
              let targetStretchZ = 0;

              if (localGrabPt && localHandPt) {
                const dxGrab = ox - localGrabPt.x;
                const dyGrab = oy - localGrabPt.y;
                const dzGrab = oz - localGrabPt.z;
                const distToGrab = Math.sqrt(dxGrab * dxGrab + dyGrab * dyGrab + dzGrab * dzGrab);
                const stretchRadius = 0.5;
                if (distToGrab < stretchRadius) {
                  const influence = Math.pow(1.0 - distToGrab / stretchRadius, 2.0);
                  targetStretchX = (localHandPt.x - localGrabPt.x) * influence;
                  targetStretchY = (localHandPt.y - localGrabPt.y) * influence;
                  targetStretchZ = (localHandPt.z - localGrabPt.z) * influence;
                }
              }

              let fx = -springK * (dx - targetStretchX) - damping * vx;
              let fy = -springK * (dy - targetStretchY) - damping * vy;
              let fz = -springK * (dz - targetStretchZ) - damping * vz;
              
              // 2. Push deformation force (push away from push points)
              localPushPoints.forEach(lpt => {
                const pdx = lx - lpt.x;
                const pdy = ly - lpt.y;
                const pdz = lz - lpt.z;
                const dist = Math.sqrt(pdx * pdx + pdy * pdy + pdz * pdz);
                
                if (dist < pushRadius && dist > 0.001) {
                  // Push direction
                  const forceMag = (1.0 - dist / pushRadius) * pushForce;
                  fx += (pdx / dist) * forceMag;
                  fy += (pdy / dist) * forceMag;
                  fz += (pdz / dist) * forceMag;
                }
              });
              
              // 3. Soft body floating wobble (gentle noise/sine wave)
              const wobbleFreq = 1.5;
              const wobbleAmp = 0.25;
              const wave = Math.sin(elapsedTime * wobbleFreq + ox * 6.0 + oy * 6.0) * wobbleAmp;
              fx += wave * ox;
              fy += wave * oy;
              fz += wave * oz;
              
              // Integrate
              vx += fx * dt;
              vy += fy * dt;
              vz += fz * dt;
              
              dx += vx * dt;
              dy += vy * dt;
              dz += vz * dt;
              
              // Save back
              vels[i * 3] = vx;
              vels[i * 3 + 1] = vy;
              vels[i * 3 + 2] = vz;
              
              disps[i * 3] = dx;
              disps[i * 3 + 1] = dy;
              disps[i * 3 + 2] = dz;
              
              posAttr.setXYZ(i, ox + dx, oy + dy, oz + dz);
            }
            
            posAttr.needsUpdate = true;
            mesh.geometry.computeVertexNormals();
          });

          renderer.render(scene, camera);
        });
      }

      function loadVerityModel() {
        if (!MODEL_VERITY) return;
        const loader = new GLTFLoader();
        loader.load(MODEL_VERITY, (gltf) => {
          const model = gltf.scene;

          // Center and scale the model
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 0.6 / maxDim; // scale to fit nicely (approx 60cm)
          model.scale.set(scale, scale, scale);

          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center.multiplyScalar(scale));

          // Set up deformable meshes
          deformableMeshes.length = 0;
          model.traverse(child => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (child.geometry && child.geometry.attributes.position) {
                // Clone original positions
                child.userData.originalPosition = child.geometry.attributes.position.clone();
                const count = child.geometry.attributes.position.count;
                child.userData.velocities = new Float32Array(count * 3);
                child.userData.displacements = new Float32Array(count * 3);
                deformableMeshes.push(child);
              }
            }
          });

          // Replace the procedural sphere
          if (verityMesh && verityGroup) {
            verityGroup.remove(verityMesh);
          }
          verityMesh = model;
          verityGroup.add(verityMesh);
        }, undefined, (error) => {
          console.error('Error loading Verity model:', error);
        });
      }

      function loadBackroomsModel() {
        if (!MODEL_BACKROOMS) return;
        const loader = new GLTFLoader();
        loader.load(MODEL_BACKROOMS, (gltf) => {
          const model = gltf.scene;
          model.position.set(0, 0, 0);
          model.traverse(child => {
            if (child.isMesh) {
              child.receiveShadow = true;
              child.castShadow = true;
              backroomsColliders.push(child);
            }
          });
          scene.add(model);
        }, undefined, (error) => {
          console.error('Error loading Backrooms model:', error);
        });
      }

      function applyDragDelta(worldPinchPos, worldDelta) {
        deformableMeshes.forEach(mesh => {
          const posAttr = mesh.geometry.attributes.position;
          const origPosAttr = mesh.userData.originalPosition;
          const vels = mesh.userData.velocities;
          const disps = mesh.userData.displacements;
          
          if (!posAttr || !origPosAttr || !vels || !disps) return;
          
          const count = posAttr.count;
          
          // Convert world pinch position and world delta to local space
          const localPinchPos = worldPinchPos.clone();
          mesh.worldToLocal(localPinchPos);
          
          const meshWorldQuaternion = new THREE.Quaternion();
          mesh.getWorldQuaternion(meshWorldQuaternion);
          const localDelta = worldDelta.clone().applyQuaternion(meshWorldQuaternion.invert());
          
          const dragRadius = 0.5; // radius of influence for dragging
          
          for (let i = 0; i < count; i++) {
            const ox = origPosAttr.getX(i);
            const oy = origPosAttr.getY(i);
            const oz = origPosAttr.getZ(i);
            
            const dx = disps[i * 3];
            const dy = disps[i * 3 + 1];
            const dz = disps[i * 3 + 2];
            
            const lx = ox + dx;
            const ly = oy + dy;
            const lz = oz + dz;
            
            const pdx = lx - localPinchPos.x;
            const pdy = ly - localPinchPos.y;
            const pdz = lz - localPinchPos.z;
            const dist = Math.sqrt(pdx * pdx + pdy * pdy + pdz * pdz);
            
            if (dist < dragRadius) {
              // Drag factor: 1.0 at center, 0.0 at boundary
              const factor = 1.0 - dist / dragRadius;
              
              // Apply delta directly to displacement
              disps[i * 3] += localDelta.x * factor;
              disps[i * 3 + 1] += localDelta.y * factor;
              disps[i * 3 + 2] += localDelta.z * factor;
              
              // Set velocity to match the drag velocity to give it momentum
              vels[i * 3] = localDelta.x / 0.016 * factor;
              vels[i * 3 + 1] = localDelta.y / 0.016 * factor;
              vels[i * 3 + 2] = localDelta.z / 0.016 * factor;
            }
          }
        });
      }

      function updateSqueezeDetection() {
        const isSqueezing = state.draggingHandIndex !== -1;

        if (isSqueezing) {
          if (!state.isSqueezing) {
            triggerSqueezeEffect();
          }
        } else {
          if (!state.isSqueezingFromMouse) {
            state.isSqueezing = false;
          }
        }
      }

      let lastVoiceTime = 0;
      function triggerSqueezeEffect() {
        state.isSqueezing = true;
        vibrate(90);

        // Play voice lines more rarely (e.g., 20% chance and at least 6 seconds cooldown)
        const now = Date.now();
        if (now - lastVoiceTime > 6000 && Math.random() < 0.2) {
          lastVoiceTime = now;
          const quotes = [MUSIC_QUOTE_1, MUSIC_REAL_VERITY, MUSIC_VOICE_VERITY, MUSIC_REVEAL_SELF];
          const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
          playAudio('squeeze', randomQuote);
        } else {
          // Play a subtle squish/squeeze synth beep instead of voice lines
          synthBeep(220, 100);
        }

        setTimeout(() => {
          if (!state.isSqueezingFromMouse) {
            state.isSqueezing = false;
          }
        }, 400);
      }

      async function activateXR() {
        if (!navigator.xr || navigator.webdriver) {
          console.log("WebXR is not supported or automated test.");
          return;
        }

        try {
          const session = await navigator.xr.requestSession('immersive-vr', {
            optionalFeatures: ['local-floor', 'hand-tracking']
          });

          await renderer.xr.setSession(session);
        } catch (err) {
          console.warn("Failed to start WebXR session:", err);
        }
      }

      // UI Bindings & Handlers
      function bindUIEvents() {
        // Copy Code Button (Copies full HTML)
        document.getElementById('copy-code-btn')?.addEventListener('click', () => {
          const htmlCode = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          navigator.clipboard.writeText(htmlCode).then(() => {
            vibrate(50);
            const btnText = document.getElementById('copy-code-text');
            if (btnText) {
              btnText.textContent = 'COPIED HTML TO CLIPBOARD!';
              setTimeout(() => { btnText.textContent = 'COPY GAME HTML'; }, 2000);
            }
          }).catch(() => {
            synthBeep(600, 100);
          });
        });

        // Play/Enter Simulator Button
        document.getElementById('play-sim-btn')?.addEventListener('click', () => {
           vibrate(60);
           state.phase = 'sim';
           renderPhase();
           if (navigator.xr && !navigator.webdriver) {
             navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
               if (supported) {
                 activateXR();
               }
             });
           }
        });

        // Play Shortcut Orb
        document.getElementById('play-shortcut-orb')?.addEventListener('click', () => {
          document.getElementById('play-sim-btn')?.click();
        });

        // Back to Menu Button
        document.getElementById('back-to-menu-btn')?.addEventListener('click', () => {
          vibrate(40);
          state.phase = 'menu';
          renderPhase();
        });

        // Enter XR Button
        document.getElementById('enter-xr-btn')?.addEventListener('click', () => {
          vibrate(60);
          activateXR();
        });

        // Check WebXR support to toggle Enter XR button visibility and update Play button
        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
            const enterXrBtn = document.getElementById('enter-xr-btn');
            if (enterXrBtn) {
              enterXrBtn.style.display = supported ? 'flex' : 'none';
            }
            const playBtn = document.getElementById('play-sim-btn');
             if (playBtn) {
               playBtn.innerHTML = supported ? '<span>PLAY IN XR</span>' : '<span>PLAY SIMULATOR</span>';
             }
           });
         } else {
           const enterXrBtn = document.getElementById('enter-xr-btn');
           if (enterXrBtn) enterXrBtn.style.display = 'none';
           const playBtn = document.getElementById('play-sim-btn');
           if (playBtn) {
             playBtn.innerHTML = '<span>PLAY SIMULATOR</span>';
           }
         }

         // Window pointerdown to advance phase from menu
         window.addEventListener('pointerdown', (e) => {
           if (e.target.closest('button, a, input, [role=button]')) return;
           if (state.phase === 'menu') {
             vibrate(60);
             state.phase = 'sim';
             renderPhase();
             if (navigator.xr && !navigator.webdriver) {
               navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                 if (supported) {
                   activateXR();
                 }
               });
             }
           }
         });

         // Canvas pointerdown to trigger squeeze in simulator
         const canvas = document.getElementById('three-canvas');
         canvas?.addEventListener('pointerdown', (e) => {
           if (state.phase === 'sim') {
             state.isSqueezingFromMouse = true;
             triggerSqueezeEffect();
             
             // Project mouse click to find intersection with Verity
             const rect = canvas.getBoundingClientRect();
             const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
             const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
             
             const raycaster = new THREE.Raycaster();
             raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
             const intersects = raycaster.intersectObject(verityGroup, true);
             if (intersects.length > 0) {
               state.mousePinchPoint = intersects[0].point;
             } else {
                state.mousePinchPoint = state.homePosition.clone();
             }
             
             mousePinchState.active = true;
             mousePinchState.prevWorldPos.copy(state.mousePinchPoint);
           }
         });

         canvas?.addEventListener('pointermove', (e) => {
           if (state.phase === 'sim' && mousePinchState.active) {
             const rect = canvas.getBoundingClientRect();
             const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
             const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
             
             const raycaster = new THREE.Raycaster();
             raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
             
             const plane = new THREE.Plane();
             plane.setFromNormalAndCoplanarPoint(
               camera.getWorldDirection(new THREE.Vector3()).negate(),
               mousePinchState.prevWorldPos
             );
             
             const targetPoint = new THREE.Vector3();
             if (raycaster.ray.intersectPlane(plane, targetPoint)) {
               const delta = targetPoint.clone().sub(mousePinchState.prevWorldPos);
               applyDragDelta(targetPoint, delta);
               mousePinchState.prevWorldPos.copy(targetPoint);
               state.mousePinchPoint = targetPoint;
             }
           }
         });

         window.addEventListener('pointerup', () => {
           mousePinchState.active = false;
           state.isSqueezingFromMouse = false;
           state.isSqueezing = false;
           state.mousePinchPoint = null;
         });
       }

      function renderPhase() {
        document.body.dataset.phase = state.phase;
      }

      function initApp() {
        applyAllEditableValues();
        renderPhase();
        bindUIEvents();
        initThreeJS();

        window.addEventListener('resize', () => {
          if (threeInitialized && renderer && camera) {
            const container = document.getElementById('sim-viewport');
            if (container) {
              camera.aspect = container.clientWidth / container.clientHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(container.clientWidth, container.clientHeight);
            }
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    </script>
