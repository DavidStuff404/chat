function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));

function print(text = "", className = "") {
    const element = document.createElement("div");

    element.className = "line " + className;
    element.textContent = text;

    output.appendChild(element);
    screen.scrollTop = screen.scrollHeight;

function clearScreen() {
    output.innerHTML = "";

}

function getUsers() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch {
        return {};
    }
}

function saveUsers(users) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
}

async function signup(args) {

    if (args.length < 2) {
        return "USAGE: Signup [user] [password]";
    }

    const username = args[0];
    const password = args.slice(1).join(" ");

    const users = getUsers();

    if (users[username]) {
        return "ERROR: USER ALREADY EXISTS.";
    }

    users[username] = password;
    saveUsers(users);

    return "ACCOUNT CREATED: " + username;
}

async function login(args) {

        return "USAGE: Login [user] [password]";

    const username = args[0];
    const password = args.slice(1).join(" ");

    const users = getUsers();

    if (!users[username]) {
        return "ERROR: USER NOT FOUND.";

    if (users[username] !== password) {
        return "ERROR: INVALID PASSWORD.";
    }

    currentUser = username;

    return "LOGIN SUCCESSFUL.\nWELCOME, " + username + ".";

async function runCommand(raw) {

    const commandLine = raw.trim();

    if (!commandLine) {
        return;
    }

    commandHistory.push(commandLine);
    historyIndex = commandHistory.length;

    print(
        (currentUser || "guest") +
        "@access:~$ " +
        commandLine,
        "white"
    );

    const parts =
        commandLine.match(/(?:[^\s"]+|"[^"]*")+/g) || [];

    const command =
        (parts.shift() || "").toLowerCase();

    const args =
        parts.map(value =>
            value.replace(/^"|"$/g, "")
        );

    if (command === "signup") {

        print(await signup(args));

        return;
    }

    if (command === "login") {

        print(await login(args));

        return;
    }

    if (!commands[command]) {

        print(
            "COMMAND NOT FOUND: " + command,
            "red"
        );

        print(
            "TYPE HELP FOR AVAILABLE COMMANDS.",
            "dim"
        );

        return;
    }

    try {

        const result =
            await commands[command](args);

        if (result) {
            print(result);
        }

    } catch {

        print(
            "COMMAND ERROR.",
            "red"
        );
    }
}

function createMatrix() {

    const canvas =
        document.createElement("canvas");

    canvas.style.position = "fixed";
    canvas.style.left = "0";
    canvas.style.top = "0";
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    canvas.style.zIndex = "-1";
    canvas.style.pointerEvents = "none";

    document.body.appendChild(canvas);

    const context =
        canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const characters =
        "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const size = 15;

    const columns =
        Math.floor(canvas.width / size);

    const drops =
        Array(columns).fill(1);

    let frames = 0;

    function draw() {

        context.fillStyle =
            "rgba(0,0,0,0.08)";

        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        context.fillStyle = "#00ff55";
        context.font = size + "px monospace";

        for (let i = 0; i < drops.length; i++) {

            const character =
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ];

            context.fillText(
                character,
                i * size,
                drops[i] * size
            );

            if (
                drops[i] * size > canvas.height &&
                Math.random() > 0.975
            ) {
                drops[i] = 0;
            }

            drops[i]++;
        }

        frames++;

        if (frames < 250) {

            requestAnimationFrame(draw);

        } else {

            canvas.remove();
        }
    }

    draw();
}

input.addEventListener("keydown", async event => {

    if (event.key === "Enter") {

        const value = input.value;

        input.value = "";

        await runCommand(value);

        screen.scrollTop =
            screen.scrollHeight;

        return;
    }

    if (event.key === "ArrowUp") {

        event.preventDefault();

        if (commandHistory.length) {

            historyIndex =
                Math.max(0, historyIndex - 1);

            input.value =
                commandHistory[historyIndex] || "";
        }

        return;
    }

    if (event.key === "ArrowDown") {

        event.preventDefault();

        if (commandHistory.length) {

            historyIndex =
                Math.min(
                    commandHistory.length,
                    historyIndex + 1
                );

            input.value =
                commandHistory[historyIndex] || "";
        }

        return;
    }

    if (event.key === "Tab") {

        event.preventDefault();

        const typed =
            input.value.toLowerCase();

        const matches =
            Object.keys(commands)
                .filter(command =>
                    command.startsWith(typed)
                );

        if (matches.length === 1) {

            input.value = matches[0];
        }
    }
});
