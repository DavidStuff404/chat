<!DOCTYPE html>
<html>
<head>
  <title>Public Chat</title>

  <style>
    body { font-family: sans-serif; }
    #errors { color: red; white-space: pre-wrap; }
  </style>
</head>

<body>

<h1>Public Chat</h1>

<div id="errors"></div>

<input id="name" placeholder="Your name">
<br><br>

<input id="message" placeholder="Message">
<button onclick="send()">Send</button>

<hr>

<div id="chat"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

function showError(e) {
  document.getElementById("errors").innerText += e + "\n";
}

const client = createClient(
  "https://otiiqsbhoghghjvwfjtw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90aWlxc2Job2doZ2hqdndmanR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NjI3MzUsImV4cCI6MjA5ODMzODczNX0.Qez48Cts5c-iBeJLSSwVqKAPp_7sPs6aiJ_Vv8I4H5Y"
);

window.send = async function () {
  const name = document.getElementById("name").value;
  const message = document.getElementById("message").value;

  const { error } = await client
    .from("messages")
    .insert([{ name, message }]);

  if (error) showError("INSERT ERROR: " + error.message);
};

async function loadMessages() {
  const { data, error } = await client
    .from("messages")
    .select("*")
    .order("identity", { ascending: true });

  if (error) showError("SELECT ERROR: " + error.message);

  document.getElementById("chat").innerHTML =
    (data || [])
      .map(m => `<p><b>${m.name}</b>: ${m.message}</p>`)
      .join("");
}

loadMessages();
setInterval(loadMessages, 2000);
</script>

</body>
</html>
