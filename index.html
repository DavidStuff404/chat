                         child.material.emissive?.setHex(colorHex);
                         child.material.emissiveIntensity = 0.1;
                     }
                 }
             });
             rightHandMesh.traverse(child => {
                 if (child.isMesh && child.name !== 'emitterTip') {
                     if (child.material) {
                         child.material.emissive?.setHex(colorHex);
                         child.material.emissiveIntensity = 0.1;
                     }
                 }
             });
         }

        function resolveBoxCollision(particle, box) {
            const p = particle.position;
            const min = box.min;
            const max = box.max;
            
            let distMinX = p.x - min.x;
            let distMaxX = max.x - p.x;
            let distMinY = p.y - min.y;
            let distMaxY = max.y - p.y;
            let distMinZ = p.z - min.z;
            let distMaxZ = max.z - p.z;
            
            let minDist = Math.min(distMinX, distMaxX, distMinY, distMaxY, distMinZ, distMaxZ);
            
            if (minDist === distMinX) {
                p.x = min.x - 0.02;
                particle.velocity.x = -Math.abs(particle.velocity.x) * 0.3;
            } else if (minDist === distMaxX) {
                p.x = max.x + 0.02;
                particle.velocity.x = Math.abs(particle.velocity.x) * 0.3;
            } else if (minDist === distMinY) {
                p.y = min.y - 0.02;
                particle.velocity.y = -Math.abs(particle.velocity.y) * 0.3;
            } else if (minDist === distMaxY) {
                p.y = max.y + 0.02;
                particle.velocity.y = Math.abs(particle.velocity.y) * 0.3;
            } else if (minDist === distMinZ) {
                p.z = min.z - 0.02;
                particle.velocity.z = -Math.abs(particle.velocity.z) * 0.3;
            } else if (minDist === distMaxZ) {
                p.z = max.z + 0.02;
                particle.velocity.z = Math.abs(particle.velocity.z) * 0.3;
            }
        }

        function spawnParticle(origin, direction, materialType) {
            if (materialType === 'ERASE') {
                // Clear nearby particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    if (particles[i].position.distanceTo(origin) < 1.5) {
                        particles[i].destroy();
                        particles.splice(i, 1);
                    }
                }
                return;
            }

            if (particles.length >= MAX_PARTICLES) {
                const p = particles.shift();
                p.destroy();
            }

            const speed = materialType === 'FIRE' ? 4.5 : 2.0;
            const spread = 0.3;
            const vx = direction.x * speed + (Math.random() - 0.5) * spread;
            const vy = direction.y * speed + (Math.random() - 0.5) * spread;
            const vz = direction.z * speed + (Math.random() - 0.5) * spread;

            const p = new PhysicsParticle(origin.x, origin.y, origin.z, vx, vy, vz, materialType);
            particles.push(p);

            playSynthSfx(materialType);
            triggerHaptic(15);
        }

        /* =======================================================================
           MAP TOUCH DETECTION & HAPTICS
           ======================================================================= */
        function checkCollisions() {
            let leftHandPos = null;
            let rightHandPos = null;
            
            if (renderer.xr.isPresenting) {
                let leftHand = null;
                let rightHand = null;
                if (hand0.handedness === 'left') leftHand = hand0;
                if (hand0.handedness === 'right') rightHand = hand0;
                if (hand1.handedness === 'left') leftHand = hand1;
                if (hand1.handedness === 'right') rightHand = hand1;
                
                if (leftHand && leftHand.joints['wrist']) {
                    leftHandPos = new THREE.Vector3();
                    leftHand.joints['wrist'].getWorldPosition(leftHandPos);
                }
                if (rightHand && rightHand.joints['wrist']) {
                    rightHandPos = new THREE.Vector3();
                    rightHand.joints['wrist'].getWorldPosition(rightHandPos);
                }
            } else {
                leftHandPos = leftHandMesh.position;
                rightHandPos = rightHandMesh.position;
            }
            
            headCollider.position.copy(camera.position);
            if (leftHandPos) leftHandCollider.position.copy(leftHandPos);
            if (rightHandPos) rightHandCollider.position.copy(rightHandPos);
            
            const playerColliders = [];
            if (leftHandPos) playerColliders.push(leftHandCollider);
            if (rightHandPos) playerColliders.push(rightHandCollider);
            playerColliders.push(headCollider);
            
            playerColliders.forEach(col => {
                for (let c of mapColliders) {
                    const colBox = new THREE.Box3().setFromObject(col);
                    if (c.worldBox.intersectsBox(colBox)) {
                        triggerHaptic(25);
                        break;
                    }
                }
            });
        }

        /* =======================================================================
           PALM MENU & VR INSTRUCTIONS
           ======================================================================= */
        const materialsList = [
            { name: 'FIRE', color: 0xff4500, label: 'Fire' },
            { name: 'WOOD', color: 0x8b4513, label: 'Wood' },
            { name: 'OIL', color: 0xa855f7, label: 'Oil' },
            { name: 'ICE', color: 0x38bdf8, label: 'Ice' },
            { name: 'WATER', color: 0x3b82f6, label: 'Water' },
            { name: 'WALL', color: 0x9ca3af, label: 'Wall' },
            { name: 'ERASE', color: 0xef4444, label: 'Erase' }
        ];

        function createPalmMenu() {
            palmMenu = new THREE.Group();
            palmMenu.visible = false;
            scene.add(palmMenu);

            materialsList.forEach((mat, index) => {
                const btnGroup = new THREE.Group();
                
                const geo = new THREE.SphereGeometry(0.02, 16, 16);
                const material = new THREE.MeshStandardMaterial({
                    color: mat.color,
                    emissive: mat.color,
                    emissiveIntensity: 0.4,
                    roughness: 0.2,
                    metalness: 0.8
                });
                const mesh = new THREE.Mesh(geo, material);
                btnGroup.add(mesh);

                const angle = (index / (materialsList.length - 1) - 0.5) * Math.PI * 0.6;
                const radius = 0.1;
                btnGroup.position.set(Math.sin(angle) * radius, 0.04, -Math.cos(angle) * radius);
                
                btnGroup.userData = { material: mat.name, color: mat.color };
                palmMenu.add(btnGroup);
                palmButtons.push(btnGroup);
            });
        }

        function updatePalmMenu(leftHandPose, camera) {
            if (!leftHandPose || !leftHandPose.visible) {
                palmMenu.visible = false;
                return;
            }

            const wrist = leftHandPose.joints['wrist'];
            const index = leftHandPose.joints['index-finger-metacarpal'];
            const pinky = leftHandPose.joints['pinky-finger-metacarpal'];

            if (!wrist || !index || !pinky) {
                palmMenu.visible = false;
                return;
            }

            const wristPos = new THREE.Vector3();
            const indexPos = new THREE.Vector3();
            const pinkyPos = new THREE.Vector3();

            wrist.getWorldPosition(wristPos);
            index.getWorldPosition(indexPos);
            pinky.getWorldPosition(pinkyPos);

            const v1 = new THREE.Vector3().subVectors(indexPos, wristPos).normalize();
            const v2 = new THREE.Vector3().subVectors(pinkyPos, wristPos).normalize();
            const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();

            const toCam = new THREE.Vector3().subVectors(camera.position, indexPos).normalize();
            const dot = normal.dot(toCam);

            const isFacing = dot > 0.4;

            if (isFacing) {
                palmMenu.visible = true;
                const targetPos = indexPos.clone().addScaledVector(normal, 0.06);
                palmMenu.position.lerp(targetPos, 0.2);
                palmMenu.lookAt(camera.position);
            } else {
                palmMenu.visible = false;
            }
        }

        function checkPalmMenuInteraction(rightHandPose) {
            if (!palmMenu.visible || !rightHandPose || !rightHandPose.visible) return;

            const indexTip = rightHandPose.joints['index-finger-tip'];
            if (!indexTip) return;

            const indexTipPos = new THREE.Vector3();
            indexTip.getWorldPosition(indexTipPos);

            palmButtons.forEach(btn => {
                const btnWorldPos = new THREE.Vector3();
                btn.getWorldPosition(btnWorldPos);
                const dist = indexTipPos.distanceTo(btnWorldPos);

                if (dist < 0.03) {
                    if (activeMaterial !== btn.userData.material) {
                        activeMaterial = btn.userData.material;
                        triggerHaptic(35);
                        
                        btn.scale.set(1.4, 1.4, 1.4);
                        setTimeout(() => {
                            btn.scale.set(1, 1, 1);
                        }, 200);

                        update2DUISelection(activeMaterial);
                    }
                }
            });
        }

        function update2DUISelection(material) {
            document.querySelectorAll('.mat-btn').forEach(btn => {
                if (btn.dataset.mat === material) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        function createVRInstructions() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(10, 10, 15, 0.95)';
            ctx.fillRect(0, 0, 512, 256);
            
            ctx.strokeStyle = '#ff4500';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, 512, 256);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('QUEST 3 HAND TRACKING ONLY', 256, 50);
            
            ctx.font = '20px sans-serif';
            ctx.fillStyle = '#cccccc';
            ctx.fillText('• Pinch fingers to emit particles', 256, 100);
            ctx.fillText('• Show left palm to open material menu', 256, 140);
            ctx.fillText('• Touch Crossroads map to interact', 256, 180);
            ctx.fillText('• Select materials with right index finger', 256, 220);
            
            const texture = new THREE.CanvasTexture(canvas);
            const geo = new THREE.PlaneGeometry(1.2, 0.6);
            const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.position.set(0, 1.5, -2);
            scene.add(mesh);
        }

        /* =======================================================================
           DYNAMIC LIGHTS POOL
           ====================================================================== */
        function initDynamicLights() {
            for (let i = 0; i < MAX_DYNAMIC_LIGHTS; i++) {
                const light = new THREE.PointLight(0xff4500, 0, 4);
                scene.add(light);
                dynamicLights.push(light);
            }
        }

        function updateDynamicLights() {
            const fireParticles = particles.filter(p => p.type === 'FIRE');
            
            dynamicLights.forEach(light => {
                light.intensity = 0;
            });
            
            for (let i = 0; i < Math.min(fireParticles.length, MAX_DYNAMIC_LIGHTS); i++) {
                const p = fireParticles[i];
                const light = dynamicLights[i];
                light.position.copy(p.position);
                light.intensity = 1.5;
                light.color.setHex(0xff4500);
            }
        }

        /* =======================================================================
           PROCEDURAL AUDIO SYNTH (SFX)
           ======================================================================= */
        function initAudioEngine() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const bufferSize = audioCtx.sampleRate * 2;
                const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 600;

                noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0;

                whiteNoise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                whiteNoise.start();
            } catch (e) {
                console.warn("Web Audio synth error", e);
            }
        }

        function playSynthSfx(type) {
            if (!audioCtx) initAudioEngine();
            if (!audioCtx || audioCtx.state !== 'running') return;

            const now = audioCtx.currentTime;
            if (type === 'FIRE') {
                noiseGain.gain.setValueAtTime(0.3, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            }
        }

        function triggerHaptic(ms = 20) {
            try {
                vibrate(ms);
            } catch(e) {}
        }

        /* =======================================================================
           POINTER & DESKTOP FALLBACK CONTROLS
           ======================================================================= */
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function setupPointerEvents() {
            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('#main-menu') || e.target.closest('#hud-layer') || e.target.closest('#vr-btn-container')) return;
                isEmitting = true;
                updateHandPointer(e);
            });

            window.addEventListener('pointermove', (e) => {
                updateHandPointer(e);
            });

            window.addEventListener('pointerup', () => { isEmitting = false; });
            window.addEventListener('pointercancel', () => { isEmitting = false; });
        }

        function updateHandPointer(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.at(2.0, targetPos);

            // Move pitch black right hand to ray target position
            rightHandMesh.position.lerp(targetPos, 0.2);
            leftHandMesh.position.set(targetPos.x - 0.4, targetPos.y - 0.1, targetPos.z);
        }

        /* =======================================================================
           PALM MENU & UI INTERACTIONS
           ======================================================================= */
        document.querySelectorAll('.mat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.currentTarget;
                document.querySelectorAll('.mat-btn').forEach(b => b.classList.remove('selected'));
                target.classList.add('selected');
                activeMaterial = target.dataset.mat;
                triggerHaptic(20);
            });
        });

        document.getElementById('btn-toggle-palm').addEventListener('click', () => {
            isPalmOpen = !isPalmOpen;
            const palmOverlay = document.getElementById('palm-gui-overlay');
            if (isPalmOpen) {
                palmOverlay.classList.add('active-palm');
            } else {
                palmOverlay.classList.remove('active-palm');
            }
            triggerHaptic(15);
        });

        /* =======================================================================
           MAIN MENU ACTIONS (Play & Copy Code)
           ======================================================================= */
        document.getElementById('btn-play').addEventListener('click', () => {
            // Unlock audio
            initBGM();
            initAudioEngine();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            triggerHaptic(50);

             const vrBtn = document.getElementById('VRButton');
             if (vrBtn && vrBtn.onclick) {
                 vrBtn.click();
             } else {
                 const mainMenu = document.getElementById('main-menu');
                 mainMenu.classList.add('hidden-menu');
                 document.getElementById('hud-layer').classList.add('visible-hud');
             }
        });

        document.getElementById('btn-copy-code').addEventListener('click', async () => {
            triggerHaptic(30);
            const code = document.documentElement.outerHTML;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(code);
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = code;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }
                showToast("Game code copied to clipboard!");
            } catch (err) {
                showToast("Copied code to clipboard!");
            }
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /* =======================================================================
           MAIN RENDER & PHYSICS LOOP
           ======================================================================= */
        const clock = new THREE.Clock();

        function renderLoop() {
            const dt = Math.min(clock.getDelta(), 0.1);

            if (!renderer.xr.isPresenting && controls) {
                controls.update();
            }

            // Update hand velocities & grab state
            updateHandVelocities(dt);
            checkGrabbing();
            
            if (renderer.xr.isPresenting) {
                leftHandMesh.visible = false;
                rightHandMesh.visible = false;
               
                updateHandMaterials(hand0);
                updateHandMaterials(hand1);
               
                updateHandBones(hand0);
                updateHandBones(hand1);
               
                let leftHand = null;
                let rightHand = null;
                if (hand0.handedness === 'left') leftHand = hand0;
                if (hand0.handedness === 'right') rightHand = hand0;
                if (hand1.handedness === 'left') leftHand = hand1;
                if (hand1.handedness === 'right') rightHand = hand1;
               
                if (leftHand && leftHand.visible) {
                    updatePalmMenu(leftHand, camera);
                    
                    if (!palmMenu.visible && isPinching(leftHand)) {
                        const pinchPos = getPinchPoint(leftHand);
                        if (pinchPos) {
                            const wrist = leftHand.joints['wrist'];
                            const indexTip = leftHand.joints['index-finger-tip'];
                            let dir = new THREE.Vector3(0, 0, -1);
                            if (wrist && indexTip) {
                                const pWrist = new THREE.Vector3();
                                const pTip = new THREE.Vector3();
                                wrist.getWorldPosition(pWrist);
                                indexTip.getWorldPosition(pTip);
                                dir.subVectors(pTip, pWrist).normalize();
                            }
                            spawnParticle(pinchPos, dir, activeMaterial);
                        }
                    }
                } else {
                    palmMenu.visible = false;
                }
               
                if (rightHand && rightHand.visible) {
                    checkPalmMenuInteraction(rightHand);
                   
                    let isInteractingWithMenu = false;
                    if (palmMenu.visible) {
                        const indexTip = rightHand.joints['index-finger-tip'];
                        if (indexTip) {
                            const indexTipPos = new THREE.Vector3();
                            indexTip.getWorldPosition(indexTipPos);
                            for (let i = 0; i < palmButtons.length; i++) {
                                const btnWorldPos = new THREE.Vector3();
                                palmButtons[i].getWorldPosition(btnWorldPos);
                                if (indexTipPos.distanceTo(btnWorldPos) < 0.06) {
                                    isInteractingWithMenu = true;
                                    break;
                                }
                            }
                        }
                    }

                    if (!isInteractingWithMenu && isPinching(rightHand)) {
                        const pinchPos = getPinchPoint(rightHand);
                        if (pinchPos) {
                            const wrist = rightHand.joints['wrist'];
                            const indexTip = rightHand.joints['index-finger-tip'];
                            let dir = new THREE.Vector3(0, 0, -1);
                            if (wrist && indexTip) {
                                const pWrist = new THREE.Vector3();
                                const pTip = new THREE.Vector3();
                                wrist.getWorldPosition(pWrist);
                                indexTip.getWorldPosition(pTip);
                                dir.subVectors(pTip, pWrist).normalize();
                            }
                            spawnParticle(pinchPos, dir, activeMaterial);
                        }
                    }
                }
            } else {
                leftHandMesh.visible = true;
                rightHandMesh.visible = true;
                palmMenu.visible = false;
               
                if (isEmitting) {
                    const emitterPos = rightHandMesh.position.clone().add(new THREE.Vector3(0, 0.02, -0.05));
                    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(rightHandMesh.quaternion);
                    spawnParticle(emitterPos, dir, activeMaterial);
                }
            }

            // Update physics props
            for (let i = 0; i < physicsProps.length; i++) {
                physicsProps[i].update(dt);
            }
            resolvePropCollisions();

            const reactiveParticles = [];
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                if (p.life > 0 && (p.type === 'WOOD' || p.type === 'OIL' || p.type === 'ICE' || p.type === 'WATER')) {
                    reactiveParticles.push(p);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt, reactiveParticles);
                if (particles[i].life <= 0) {
                    particles[i].destroy();
                    particles.splice(i, 1);
                }
            }

            updateDynamicLights();
            updateHandLights();
            updateHandGlow();
            checkCollisions();

            renderer.render(scene, camera);
        }

        /* =======================================================================
           BOOTSTRAP
           ======================================================================= */
        function init() {
            applyAllEditableValues();
            initScene();
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
