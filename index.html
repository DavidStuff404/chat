<script>
"use strict";

const output = document.getElementById("output");
const input = document.getElementById("input");
const screen = document.getElementById("screen");

const STORAGE_KEY = "access_terminal_users";

let currentUser = null;
let sessionStart = Date.now();
let history = [];
let historyIndex = 0;

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}

function print(text="",cls=""){
  const line=document.createElement("div");
  line.className="line "+cls;
  line.textContent=text;
  output.appendChild(line);
  screen.scrollTop=screen.scrollHeight;
}

function clear(){
  output.innerHTML="";
  return "";
}

function getUsers(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch{
    return {};
  }
}

function saveUsers(users){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(users));
}

async function signup(args){
  if(args.length<2)
    return "USAGE: Signup [user] [password]";

  const user=args[0];
  const password=args.slice(1).join(" ");
  const users=getUsers();

  if(users[user])
    return "ERROR: USER ALREADY EXISTS.";

  users[user]=password;
  saveUsers(users);

  return "ACCOUNT CREATED: "+user;
}

async function login(args){
  if(args.length<2)
    return "USAGE: Login [user] [password]";

  const user=args[0];
  const password=args.slice(1).join(" ");
  const users=getUsers();

  if(!users[user])
    return "ERROR: USER NOT FOUND.";

  if(users[user]!==password)
    return "ERROR: INVALID PASSWORD.";

  currentUser=user;

  return "LOGIN SUCCESSFUL.\nWELCOME, "+user+".";
}

async function runCommand(raw){

  const trimmed=raw.trim();

  if(!trimmed)
    return;

  history.push(trimmed);
  historyIndex=history.length;

  print((currentUser||"guest")+"@access:~$ "+trimmed,"white");

  const parts=trimmed.match(/(?:[^\s"]+|"[^"]*")+/g)||[];

  const command=(parts.shift()||"").toLowerCase();

  const args=parts.map(x=>x.replace(/^"|"$/g,""));

  if(command==="signup"){
    print(await signup(args));
    return;
  }

  if(command==="login"){
    print(await login(args));
    return;
  }

  if(!commands[command]){
    print("COMMAND NOT FOUND: "+command,"red");
    print("TYPE HELP FOR AVAILABLE COMMANDS.","dim");
    return;
  }

  try{
    const result=await commands[command](args);

    if(result)
      print(result);
  }catch{
    print("COMMAND ERROR.","red");
  }
}

function matrix(){

  const canvas=document.createElement("canvas");

  canvas.style.position="fixed";
  canvas.style.inset="0";
  canvas.style.zIndex="-1";
  canvas.style.pointerEvents="none";

  document.body.appendChild(canvas);

  const ctx=canvas.getContext("2d");

  canvas.width=innerWidth;
  canvas.height=innerHeight;

  const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const size=15;

  const columns=Math.floor(canvas.width/size);
  const drops=Array(columns).fill(1);

  let frames=0;

  function draw(){

    ctx.fillStyle="rgba(0,0,0,.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff55";
    ctx.font=size+"px monospace";

    for(let i=0;i<drops.length;i++){

      const char=chars[Math.floor(Math.random()*chars.length)];

      ctx.fillText(
        char,
        i*size,
        drops[i]*size
      );

      if(drops[i]*size>canvas.height&&Math.random()>.975)
        drops[i]=0;

      drops[i]++;
    }

    frames++;

    if(frames<250)
      requestAnimationFrame(draw);
    else
      canvas.remove();
  }

  draw();
}

input.addEventListener("keydown",async e=>{

  if(e.key==="Enter"){
    const value=input.value;
    input.value="";
    await runCommand(value);
    screen.scrollTop=screen.scrollHeight;
  }

  if(e.key==="ArrowUp"){
    e.preventDefault();

    if(history.length){
      historyIndex=Math.max(0,historyIndex-1);
      input.value=history[historyIndex]||"";
    }
  }

  if(e.key==="ArrowDown"){
    e.preventDefault();

    if(history.length){
      historyIndex=Math.min(history.length,historyIndex+1);
      input.value=history[historyIndex]||"";
    }
  }

  if(e.key==="Tab"){
    e.preventDefault();

    const val=input.value.toLowerCase();

    const matches=Object.keys(commands)
      .filter(x=>x.startsWith(val));

    if(matches.length===1)
      input.value=matches[0];
  }
});

document.addEventListener("click",()=>{

});

}

boot();
