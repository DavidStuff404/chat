<script>
"use strict";

const output = document.getElementById("output");
const input = document.getElementById("input");
const screen = document.getElementById("screen");
const terminal = document.getElementById("terminal");

const STORAGE_KEY = "access_terminal_users";

let currentUser = null;

const commands = {
  help: () => `
AVAILABLE COMMANDS

SYSTEM
  help          show this command list
  about         about this terminal
  clear         clear the screen
  cls           clear the screen
  date          show local date
  time          show local time
  uptime        show session uptime

VISUAL
  matrix        start a digital rain effect
  glow          toggle terminal glow

  scanlines     toggle scanlines

ACCOUNT

OTHER
  history       show command history

`,

  about: () =>
    `ACCESS TERMINAL\n\nA fictional browser-based terminal created for entertainment.\nNo real hacking functions are included.`,

  version: () =>
    `ACCESS TERMINAL v4.2.7\nBuild: LOCAL-ENTERTAINMENT`,

  clear: clear,
  cls: clear,

  date: () => new Date().toLocaleDateString(),
  time: () => new Date().toLocaleTimeString(),

  uptime: () => {
    const seconds = Math.floor((Date.now() - sessionStart) / 1000);
    return `SESSION UPTIME: ${seconds}s`;
  },

  whoami: () =>
    currentUser ? `CURRENT USER: ${currentUser}` : "CURRENT USER: guest",

  hostname: () =>
    `HOST: ${location.hostname || "localhost"}`,

  status: () =>
    `SYSTEM STATUS\n\nTerminal: ONLINE\nSession: ACTIVE\nNetwork: ${navigator.onLine ? "ONLINE" : "OFFLINE"}\nAuthentication: LOCAL\nExternal access: DISABLED`,

  info: () =>
    `BROWSER INFORMATION\n\nBrowser: ${navigator.userAgent}\nLanguage: ${navigator.language}\nCores: ${navigator.hardwareConcurrency || "unknown"}\nPlatform: ${navigator.platform}`,

  platform: () => navigator.platform,

  screen: () =>
    `SCREEN\n\nResolution: ${screen.width} x ${screen.height}\nAvailable: ${screen.availWidth} x ${screen.availHeight}\nPixel ratio: ${devicePixelRatio}`,

  ping: async () => {

   ██║  ██║╚██████╗╚██████╗███████╗███████║███████║
   ╚═╝  ╚═╝ ╚═════╝ ╚═════╝╚══════╝╚══════╝╚══════╝`,

  matrix: () => {
    matrixEffect();
    return "DIGITAL RAIN INITIALIZED...";

  glow: () => {

      "Initializing scan...",

      "Analyzing available interfaces...",

    for (const s of steps) {

  decrypt: async () => {

     ACCESS NODE`,

`ACCESS TERMINAL

This is a fictional terminal interface.

Signup and Login are entertainment features.

};

const sessionStart = Date.now();
const history = [];
let historyIndex = 0;

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}

function print(text="", cls=""){
  const div=document.createElement("div");
  div.className="line "+cls;
  div.textContent=text;
  output.appendChild(div);
  screen.scrollTop=screen.scrollHeight;
}

function clear(){
  output.innerHTML="";
  return "";
}

function getUsers(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch{
    return {};
  }
}

function saveUsers(users){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(users));
}

async function signup(args){
  if(args.length < 2)
    return "USAGE: Signup [user] [password]";

  const user=args[0];
  const password=args.slice(1).join(" ");
  const users=getUsers();

  if(users[user])
    return "ERROR: USER ALREADY EXISTS.";

  users[user]=password;
  saveUsers(users);

  return `ACCOUNT CREATED FOR ${user}\nStored locally in this browser.`;
}

async function login(args){
  if(args.length < 2)
    return "USAGE: Login [user] [password]";

  const user=args[0];
  const password=args.slice(1).join(" ");
  const users=getUsers();

  if(!users[user])
    return "ERROR: USER NOT FOUND.";

  if(users[user] !== password)
    return "ERROR: INVALID PASSWORD.";

  currentUser=user;
  return `LOGIN SUCCESSFUL.\nWELCOME, ${user}.`;
}

async function runCommand(raw){
  const trimmed=raw.trim();
  if(!trimmed)return;

  history.push(trimmed);
  historyIndex=history.length;

  print("guest@access:~$ "+trimmed,"white");

  const parts=trimmed.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
  const command=(parts.shift() || "").toLowerCase();
  const args=parts.map(x=>x.replace(/^"|"$/g,""));

  if(command === "signup"){
    const result=await signup(args);
    print(result);
    return;
  }

  if(command === "login"){
    const result=await login(args);
    print(result);
    return;
  }

  if(!commands[command]){
    print(`COMMAND NOT FOUND: ${command}`,"red");
    print("Type HELP for available commands.","dim");
    return;
  }

  try{
    const result=await commands[command](args);
    if(result) print(result);
  }catch(e){
    print("COMMAND ERROR.","red");
  }
}

function matrixEffect(){
  const canvas=document.createElement("canvas");
  canvas.style.position="fixed";
  canvas.style.inset="0";
  canvas.style.zIndex="30";
  canvas.style.pointerEvents="none";
  canvas.style.opacity=".28";
  document.body.appendChild(canvas);

  const ctx=canvas.getContext("2d");

  function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
  }

  resize();
  addEventListener("resize",resize);

  const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const size=15;
  let columns=Math.floor(canvas.width/size);
  let drops=Array(columns).fill(1);

  let frame=0;

  function draw(){
    ctx.fillStyle="rgba(0,0,0,.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff66";
    ctx.font=size+"px monospace";

    for(let i=0;i<drops.length;i++){
      const char=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(char,i*size,drops[i]*size);

      if(drops[i]*size>canvas.height && Math.random()>.975)
        drops[i]=0;

      drops[i]++;
    }

    frame++;

    if(frame<300)
      requestAnimationFrame(draw);
    else
      canvas.remove();
  }

  draw();
}

input.addEventListener("keydown",async e=>{
  if(e.key==="Enter"){
    const value=input.value;
    input.value="";
    await runCommand(value);
    screen.scrollTop=screen.scrollHeight;
  }

  if(e.key==="ArrowUp"){
    e.preventDefault();
    if(history.length){
      historyIndex=Math.max(0,historyIndex-1);
      input.value=history[historyIndex] || "";
    }
  }

  if(e.key==="ArrowDown"){
    e.preventDefault();
    if(history.length){
      historyIndex=Math.min(history.length,historyIndex+1);
      input.value=history[historyIndex] || "";
    }
  }

  if(e.key==="Tab"){
    e.preventDefault();
    const val=input.value.toLowerCase();
    const matches=Object.keys(commands).filter(x=>x.startsWith(val));
    if(matches.length===1) input.value=matches[0];
  }
});

document.addEventListener("click",()=>input.focus());

async function boot(){
  await sleep(250);
  print("ACCESS TERMINAL v4.2.7","cyan");
  await sleep(150);
  print("Initializing local session...","dim");
  await sleep(250);
  print("Interface loaded.","green");
  await sleep(150);
  print("");
  print("Type HELP to list available commands.","white");
  print("");
}

boot();
</script>

</body>
</html>
