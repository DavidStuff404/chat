<script>
(function() {
  // Function to set or update viewport meta tag
  function ensureViewportMeta() {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    
    if (!viewportMeta) {
      // Create viewport meta tag if it doesn't exist
      viewportMeta = document.createElement('meta');
      viewportMeta.name = 'viewport';
      document.head.insertBefore(viewportMeta, document.head.firstChild);
    }
    
    // Set viewport to prevent iOS auto-zoom
    // width=device-width: Use device width
    // initial-scale=1.0: Initial zoom level
    // maximum-scale=1.0: Prevent zooming beyond 1.0
    // user-scalable=no: Disable user scaling (prevents pinch zoom and auto-zoom on input focus)
    viewportMeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
  }
  
  // Run immediately if DOM is already ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ensureViewportMeta);
  } else {
    ensureViewportMeta();
  }
  
  // Also ensure it's set when head is ready (in case script runs before head)
  if (!document.head) {
    var observer = new MutationObserver(function(mutations) {
      if (document.head) {
        ensureViewportMeta();
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true });
  }
})();
</script>

<script>
(function() {
  var originalAddEventListener = EventTarget.prototype.addEventListener;
  var originalRemoveEventListener = EventTarget.prototype.removeEventListener;

  // Track pointerdown position; only synthesize click when displacement is small.
  var ptrDownPos = null;
  var TAP_THRESHOLD_SQ = 100; // 10px squared

  originalAddEventListener.call(document, 'pointerdown', function(e) {
    if (e.button !== 0) return;
    ptrDownPos = { x: e.clientX, y: e.clientY };
  }, { capture: true, passive: true });

    if (!ptrDownPos) return true; // no pointerdown recorded — be safe, treat as tap
    var dx = e.clientX - ptrDownPos.x;
    var dy = e.clientY - ptrDownPos.y;
    return (dx * dx + dy * dy) <= TAP_THRESHOLD_SQ;
  }

  var listenerMap = new WeakMap();

  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (type === 'click' && typeof listener === 'function') {
      var elementMap = listenerMap.get(this);
      if (!elementMap) {
        elementMap = new Map();
        listenerMap.set(this, elementMap);
      }

      var existingPointerListener = elementMap.get(listener);
      if (existingPointerListener) {
        return originalAddEventListener.call(this, 'pointerup', existingPointerListener, options);
      }

      var pointerupListener = function(e) {
        if (e.button !== 0) return;
        if (!isTap(e)) return;

        var clickEvent = new MouseEvent('click', {
          bubbles: e.bubbles, cancelable: e.cancelable, view: e.view,
          detail: 1,
          screenX: e.screenX, screenY: e.screenY,
          clientX: e.clientX, clientY: e.clientY,
          ctrlKey: e.ctrlKey, altKey: e.altKey,
          shiftKey: e.shiftKey, metaKey: e.metaKey,
          button: e.button, relatedTarget: e.relatedTarget
        });

        Object.defineProperty(clickEvent, 'currentTarget', { value: e.currentTarget, enumerable: true });

      };

      elementMap.set(listener, pointerupListener);
      return originalAddEventListener.call(this, 'pointerup', pointerupListener, options);
    }

    return originalAddEventListener.call(this, type, listener, options);
  };

      if (elementMap) {

        if (pointerupListener) {
          elementMap.delete(listener);
          return originalRemoveEventListener.call(this, 'pointerup', pointerupListener, options);
        }
      }
    }
    return originalRemoveEventListener.call(this, type, listener, options);
  };

  // Only dispatch when the gesture is a tap (not a swipe).
  var SEKAI_SYNTHETIC_KEY = '__sekai_sc';

  originalAddEventListener.call(document, 'pointerup', function(e) {
    if (e.button !== 0) return;
    if (!isTap(e)) return;
    var t = e.target;
    if (!t || !t.dispatchEvent) return;

    var evt = new MouseEvent('click', {
      bubbles: true, cancelable: true, view: e.view,
      detail: 1,
      screenX: e.screenX, screenY: e.screenY,
      clientX: e.clientX, clientY: e.clientY,
      ctrlKey: e.ctrlKey, altKey: e.altKey,
      shiftKey: e.shiftKey, metaKey: e.metaKey,
      button: 0, relatedTarget: null
    });
    Object.defineProperty(evt, SEKAI_SYNTHETIC_KEY, { value: true });
    t.dispatchEvent(evt);
  }, false);

  originalAddEventListener.call(document, 'click', function(e) {
    if (!e[SEKAI_SYNTHETIC_KEY]) {
      e.stopImmediatePropagation();
    }

})();

<script>
(function() {
  // Track recent touch to block emulated mouse events
  var lastTouchTime = 0;
  var TOUCH_MOUSE_DELAY = 200; // ms to block mouse events after touch

  // Global touch tracker - set flag when touch occurs
  document.addEventListener('touchstart', function() {
    lastTouchTime = Date.now();
  }, { passive: true, capture: true });

  document.addEventListener('touchend', function() {
    lastTouchTime = Date.now();
  }, { passive: true, capture: true });

  // Block emulated mouse events that follow touch
  // BUT allow them on focusable elements (inputs need mousedown for focus)
  function blockEmulatedMouseHandler(e) {
    if (Date.now() - lastTouchTime < TOUCH_MOUSE_DELAY) {
      // Don't block on focusable elements - they need mousedown for focus
      var target = e.target;
      if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) {
        return; // Allow the event
      }
      e.stopPropagation();
      // NOTE: Do NOT call preventDefault() here.
      // CSS user-select:none already handles text selection prevention.
      // On iOS WKWebView, mousedown.preventDefault() can intermittently
      // suppress click event synthesis, breaking .onclick handlers.
    }
  }

  // Capture phase blockers for emulated mouse events
  document.addEventListener('mousedown', blockEmulatedMouseHandler, { capture: true });

  // Patch addEventListener to force passive on touch events.
  // Expose original globally so SCROLL_BLOCK_SCRIPT can register a
  // non-passive touchmove handler to block iOS WKWebView parent scroll.
  var originalAddEventListener = EventTarget.prototype.addEventListener;
  window.__sekai_orig_ael = originalAddEventListener;

  EventTarget.prototype.addEventListener = function(type, listener, options) {
    // Convert touchstart/touchmove to passive
    // Mouse event emulation is handled by our global blockers above
    if (type === 'touchstart' || type === 'touchmove') {
      var newOptions = Object.assign({}, options || {}, { passive: true });
      return originalAddEventListener.call(this, type, listener, newOptions);
    }
    return originalAddEventListener.call(this, type, listener, options);
  };
})();
</script>

<script>
(function() {
  // Track if dom_ready was already sent
  var domReadySent = false;

  function sendDomReady() {
    if (domReadySent) return;
    domReadySent = true;
    window.parent.postMessage({ type: 'sekai_iframe_dom_ready' }, '*');
  }

  // Send dom_ready when DOMContentLoaded fires
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sendDomReady);
  } else {
    // DOM already loaded
    sendDomReady();
  }

  // Helper to serialize message - handles objects that would become [object Object]
  function serializeMessage(msg) {
    if (msg === null || msg === undefined) return '';
    if (typeof msg === 'string') return msg;
    if (typeof msg === 'object') {
      try {
        return JSON.stringify(msg);
      } catch (e) {
        return String(msg);
      }
    }
    return String(msg);
  }

  // Catch JS errors and send to parent
  window.onerror = function(message, source, lineno, colno, error) {
    window.parent.postMessage({
      type: 'sekai_iframe_js_error',
      message: serializeMessage(message),
      source: source || '',
      lineno: lineno || 0,
      colno: colno || 0,
      errorName: error ? error.name : '',
      errorStack: error ? error.stack : ''
    }, '*');
    // Return false to allow default error handling
    return false;
  };

  // Also catch unhandled promise rejections
  window.addEventListener('unhandledrejection', function(event) {
    var reason = event.reason;
    var isError = reason instanceof Error;
    window.parent.postMessage({
      type: 'sekai_iframe_js_error',
      message: reason ? serializeMessage(reason) : 'Unhandled promise rejection',
      source: 'unhandledrejection',
      lineno: 0,
      colno: 0,
      errorName: isError ? reason.name : '',
      errorStack: isError ? reason.stack : ''
    }, '*');
  });
})();
</script>

<script>
(function() {
  // Collect all devicemotion listeners registered by game code
  var deviceMotionListeners = [];

  // Save original addEventListener
  var originalAddEventListener = window.addEventListener;

  // Intercept addEventListener to capture devicemotion listeners
  window.addEventListener = function(type, listener, options) {
    if (type === 'devicemotion' && typeof listener === 'function') {
      deviceMotionListeners.push(listener);
      // Also add to native in case permission is granted elsewhere
      return originalAddEventListener.call(this, type, listener, options);
    }
    return originalAddEventListener.call(this, type, listener, options);
  };

  // Also intercept removeEventListener
  var originalRemoveEventListener = window.removeEventListener;
  window.removeEventListener = function(type, listener, options) {
    if (type === 'devicemotion' && typeof listener === 'function') {
      var index = deviceMotionListeners.indexOf(listener);
      if (index !== -1) {
        deviceMotionListeners.splice(index, 1);
      }
    }
    return originalRemoveEventListener.call(this, type, listener, options);
  };

  // Listen for forwarded motion data from parent
  window.addEventListener('message', function(event) {
    if (!event.data || event.data.type !== '__sekai_device_motion__') return;

    var data = event.data;

    // Create a synthetic event-like object
    var syntheticEvent = {
      accelerationIncludingGravity: data.accelerationIncludingGravity,
      acceleration: data.acceleration,
      rotationRate: data.rotationRate,
      interval: data.interval || 16,
      // Make it look like a real event
      type: 'devicemotion',
      timeStamp: data.timestamp || Date.now(),
      target: window,
      currentTarget: window,
      preventDefault: function() {},
      stopPropagation: function() {},
      stopImmediatePropagation: function() {}
    };

    // Trigger all registered listeners
    deviceMotionListeners.forEach(function(listener) {
      try {
        listener(syntheticEvent);
      } catch (e) {
        // Ignore listener errors
      }
    });
  });
})();
</script>

<script>
(function() {
  // Track all AudioContexts created in this iframe

  var originalAudioContext = window.AudioContext || window.webkitAudioContext;

  if (originalAudioContext) {
    // Patch AudioContext constructor to track instances and enforce initial mute state.

    // AudioNode sources cannot produce audio before the parent sends receive_audio_mute.
    // This closes the race window between iframe load start and the first mute message.
    var PatchedAudioContext = function() {
      var ctx = new originalAudioContext();
      audioContexts.push(ctx);
      // Per-ctx diagnostic flags. Each AudioContext instance warns at most
      // once for each of the two diagnostics below, so a rAF-driven
      // resume() loop (observed in real games) does not spam vconsole,
      // while new contexts still act as fresh sentinels.
      var resumeBlockWarned = false;
      var browserResumeWarned = false;
      if (typeof ctx.resume === 'function') {
        var originalCtxResume = ctx.resume.bind(ctx);
        ctx.resume = function() {
          if (isMuted) {
            // Game code attempted to resume AudioContext during mute window.
            // Blocked here prevents the audibility observer from reporting a
            // false playing_started. Logged once per ctx to confirm the
            // "game code calls resume()" leak path is real.
            if (!resumeBlockWarned) {
              resumeBlockWarned = true;
              try {
                console.warn(
                  '[sekai-iframe-audio] AudioContext.resume() blocked while muted (once per ctx)'
                );
              } catch (e) {}
            }
            return Promise.resolve();
          }
          return originalCtxResume();

        ctx.suspend().catch(function() {});

      // transitions between suspended/running/closed. ctx.suspend()/resume()
      // resolve asynchronously, so the statechange event is the only reliable
      // signal that the context has actually moved.
      try {
        ctx.addEventListener('statechange', function() {
          // Sentinel: resume() is blocked above while muted, so if the ctx
          // still enters 'running' during mute, the only remaining cause is
          // browser-initiated state recovery (e.g. iOS audio session
          // interruption ending). If this log ever appears in practice, the
          // resume() block alone is not enough — we must also guard
          // notifyAudibilityChange() to suppress audible=true while muted.
          // Logged once per ctx to avoid repeated warnings on oscillating
          // state transitions.

            browserResumeWarned = true;
            try {

                '[sekai-iframe-audio] AudioContext entered running while muted (browser-initiated, once per ctx)'
              );

      }

          try { element.muted = true; } catch (e) {}

  };

  // This is more reliable than checking .paused at mute time, because iOS pauses
  // audio elements when the app goes to background BEFORE our JS visibility handler
  // runs — by the time muteAllAudio() is called, all elements are already paused
  // by the OS and .paused === true for all of them.
  var intendedPlaying = new Set();

  if (window.HTMLMediaElement) {

    var originalHTMLPause = HTMLMediaElement.prototype.pause;

            originalHTMLPause.call(this);

      if (ctx && ctx.state === 'running') {

    // Pause first, then force mute so background playback cannot leak audio.
    // The audibility observer below will automatically emit
    // sekai_iframe_audio_playing_stopped once the pause/mute propagates, so
    // we no longer post a separate sekai_iframe_audio_muted confirmation.
    collectTrackedMediaElements().forEach(function(el) {
      try {

      } catch (e) {

      }

      // Reason: muteAllAudio() calls ctx.suspend(), which is async. If
      // unmuteAllAudio() (or a touchstart retry) runs before suspend() resolves,
      // ctx.state is still 'running' — the old suspended/interrupted-only guard

      // suspended. By calling resume() on 'running' contexts too, we queue a

      // (suspend → resume) and the context ends up running as intended.
      // resume() on an already-running context is a no-op per the Web Audio spec.
      if (ctx && ctx.state !== 'closed') {

    isMuted = false;

    // Resume all AudioContexts immediately (handles 'suspended' and 'interrupted')

    // Restore tracked media elements to their original muted state.
    collectTrackedMediaElements().forEach(function(el) {
      var wasMuted = mutedElements.get(el);
      if (wasMuted !== undefined) {

    // iOS pauses audio/video elements on app-switch before our JS handler runs,
    // so simply unmuting is not enough — we must call .play() to restore.
    // We populate pendingResume here; the persistent touchstart listener below
    // retries on every user touch until all elements are playing again.
    pendingResume = [];
    intendedPlaying.forEach(function(el) {
      if (!el || el.ended) return;
      pendingResume.push(el);

    pendingResume.forEach(function(el) {

  // Registered once at script init using capture phase so game code stopPropagation
  // cannot prevent it from running.

    var toTry = pendingResume;
    pendingResume = [];
    toTry.forEach(function(el) {

  //

  //   - "played after it shouldn't" — audio duration > card visible duration
  // Both failure modes are invisible from the parent side alone.

            --ui-bg: rgba(12, 12, 16, 0.85);
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            overflow: hidden;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            color: #ffffff;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Overlay UI Container */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 40;
            pointer-events: none;
        }

        /* Main Menu - Minimalist (No Title, Only 2 Buttons) */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 50;
            pointer-events: auto;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #main-menu.hidden-menu {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .menu-btn {
            width: 260px;
            padding: 16px 28px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .btn-play {
            background: linear-gradient(135deg, #ff4500 0%, #d02000 100%);
            color: #ffffff;
            border-color: rgba(255, 69, 0, 0.5);
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.4);
        }

        .btn-play:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.3);
        }

        .btn-copy {
            background: rgba(30, 30, 40, 0.8);
            color: #e0e0e0;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-copy:active {
            transform: scale(0.95);
            background: rgba(50, 50, 65, 0.9);
        }

        /* HUD / Controls UI */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #hud-layer.visible-hud {
            opacity: 1;
        }

        .hud-card {
            pointer-events: auto;
            background: var(--ui-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* Palm Menu (3D/2D Material Selector) */
        #palm-gui-overlay {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            display: flex;
            gap: 10px;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(255, 69, 0, 0.3);
            border-radius: 20px;
            padding: 10px 14px;
            pointer-events: auto;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 69, 0, 0.15);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #palm-gui-overlay.active-palm {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .mat-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .mat-btn.selected {
            border-color: var(--accent);
            background: rgba(255, 69, 0, 0.2);
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(255, 69, 0, 0.4);
        }

        .mat-btn:active {
            transform: scale(0.95);
        }

        .mat-icon {
            width: 22px;
            height: 22px;
        }

        .mat-label {
            font-size: 9px;
            font-weight: 700;
            margin-top: 3px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Toast notification */
        #toast {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        #toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        #vr-btn-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 45;
            pointer-events: auto;
        }
    </style>

<body>

    <audio id="bgm" loop=""></audio>

    <div id="webgl-canvas"><canvas width="776" height="1178" style="display: block; width: 388px; height: 589px;"></canvas></div>

    <div id="ui-overlay">
        <!-- Toast Notification -->
        <div id="toast">Code copied to clipboard!</div>

        <!-- Main Menu: Title-less per user instruction, Play & Copy Code buttons only -->
        <div id="main-menu">
             <div class="absolute top-6 right-6 flex items-center gap-2 bg-black/40 border border-emerald-500/30 px-3 py-1.5 rounded-full text-xs font-mono text-emerald-400">
                 <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                 QUEST 3S EXCLUSIVE MODE
             </div>
            
             <div class="bg-black/60 border border-white/10 p-8 rounded-3xl backdrop-blur-xl flex flex-col items-center gap-6 max-w-md w-full mx-4 shadow-2xl">
                 <div class="flex flex-col items-center gap-2 text-center">
                     <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-orange-600 to-red-500 flex items-center justify-center shadow-lg shadow-orange-500/20 mb-2">
                         <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="cpu" aria-hidden="true" class="lucide lucide-cpu w-8 h-8 text-white animate-pulse"><path d="M12 20v2"></path><path d="M12 2v2"></path><path d="M17 20v2"></path><path d="M17 2v2"></path><path d="M2 12h2"></path><path d="M2 17h2"></path><path d="M2 7h2"></path><path d="M20 12h2"></path><path d="M20 17h2"></path><path d="M20 7h2"></path><path d="M7 20v2"></path><path d="M7 2v2"></path><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg>
                     </div>
                     <div class="text-xs text-orange-500 font-bold tracking-widest uppercase">Meta Quest 3 / 3S Optimized</div>
                     <p class="text-xs text-gray-400 max-w-xs">High-fidelity WebXR physics sandbox with advanced joint-level hand tracking and dynamic thermal interactions.</p>
                 </div>
                
                 <div class="w-full h-[1px] bg-white/10"></div>
                
                 <div class="flex flex-col gap-3 w-full">
                     <button id="btn-play" class="menu-btn btn-play w-full">
                         <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="play" aria-hidden="true" class="lucide lucide-play w-6 h-6"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg>
                         <span>ENTER VR SANDBOX</span>
                     </button>
                     <button id="btn-copy-code" class="menu-btn btn-copy w-full">
                         <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="copy" aria-hidden="true" class="lucide lucide-copy w-5 h-5"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                         <span>COPY SOURCE CODE</span>
                     </button>
                 </div>
                
                 <div class="flex items-center gap-4 text-[10px] text-gray-500 font-mono">
                     <div class="flex items-center gap-1">
                         <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                         HAND TRACKING: OK
                     </div>
                     <div class="flex items-center gap-1">
                         <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                         PHYSICS: 90HZ
                     </div>
                     <div class="flex items-center gap-1">
                         <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                         WEBXR: ACTIVE
                     </div>
                 </div>
             </div>
         </div>

        <!-- HUD Layer -->
        <div id="hud-layer">
            <div class="flex justify-between items-center">
                <div class="hud-card flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                     <span class="text-xs font-semibold text-gray-300">Quest 3 Hand Tracking Active</span>
                </div>
                <button id="btn-toggle-palm" class="hud-card flex items-center gap-2 hover:border-orange-500/50 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="hand" aria-hidden="true" class="lucide lucide-hand w-4 h-4 text-orange-500"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"></path><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
                    <span class="text-xs font-bold text-gray-200">Show Palm Menu</span>
                </button>
            </div>

            <!-- Palm Material Selector GUI -->

    <script type="module">
        import { applyAllEditableValues, getConfig, initBGM, vibrate } from './js/sekai/bridge/index.js';

        /* =======================================================================
           THREE.JS VR SCENE INITIALIZATION
           ======================================================================= */
        function initScene() {
            const container = document.getElementById('webgl-canvas');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(getConfig('colors', 'bg', '#050507'));
            scene.fog = new THREE.FogExp2(0x050507, 0.04);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });

                ICE: new THREE.MeshPhysicalMaterial({ color: 0x7dd3fc, opacity: 0.8, transparent: true, roughness: 0.1 }),
                WALL: new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.3 }),
                OIL: new THREE.MeshStandardMaterial({ color: 0x3b0764, roughness: 0.2, metalness: 0.9 }),
                WATER: new THREE.MeshPhysicalMaterial({ color: 0x2563eb, opacity: 0.7, transparent: true, roughness: 0.1 }),

            // VR Button setup

            // OrbitControls for Desktop fallback
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.2, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.05;

            // Lighting Setup (Dark & Realistic)
            const ambientLight = new THREE.AmbientLight(0x1a1a24, 0.8);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            mainLight.position.set(5, 12, 6);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            const accentPoint = new THREE.PointLight(0xff4500, 1.5, 12);
            accentPoint.position.set(-2, 3, -1);
            scene.add(accentPoint);

            // Arena Base & Physics Boundaries
            createArenaBoundaries();

            setupHandsAndColliders();

            loadRobloxMap();

            // Create Palm Menu
            createPalmMenu();

            // Create VR Instructions
            createVRInstructions();

            // Initialize Dynamic Lights Pool
            initDynamicLights();

             // Initialize Hand Lights
             initHandLights();

             // Spawn Physics Props
             spawnPhysicsProps();

            // Handle Window Resize
            window.addEventListener('resize', onWindowResize);

            // Pointer input for spawning & hands movement in Desktop mode
            setupPointerEvents();

            // Start Render Loop
            renderer.setAnimationLoop(renderLoop);

        /* =======================================================================
           MAP & ENVIRONMENT (User Model Crossroads Map)
           ======================================================================= */
        function loadRobloxMap() {
            const mapUrl = getConfig('models', 'user-model-1-crossroads', 'https://prod-data.sekai.chat/v3-games/chat-creation/models/86126d26-bc6f-49ab-a364-9764aa916343.glb');
            
            const loader = new THREE.GLTFLoader();
            loader.load(
                mapUrl,
                (gltf) => {
                    crossroadsMap = gltf.scene;
                    
                    crossroadsMap.position.set(0, 0, 0);
                    crossroadsMap.scale.set(0.5, 0.5, 0.5);

                    crossroadsMap.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            
                            child.geometry.computeBoundingBox();
                            mapColliders.push({
                                mesh: child,
                                localBox: child.geometry.boundingBox.clone(),
                                worldBox: new THREE.Box3()
                            });
                        }
                    });

                    scene.add(crossroadsMap);
                    
                    setTimeout(() => {
                        mapColliders.forEach(c => {
                            c.mesh.updateMatrixWorld(true);
                            c.worldBox.copy(c.localBox).applyMatrix4(c.mesh.matrixWorld);
                        });
                    }, 500);
                },
                undefined,
                (err) => {
                    console.warn("Crossroads GLTF failed to load, procedural fallback active", err);
                    createFallbackCrossroads();
                }
            );
        }

        function createFallbackCrossroads() {
            const group = new THREE.Group();
            
            const groundGeo = new THREE.BoxGeometry(20, 0.5, 20);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -0.25;
            group.add(ground);
            
            const towerGeo = new THREE.BoxGeometry(2, 6, 2);
            const towerMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });
            
            const tower1 = new THREE.Mesh(towerGeo, towerMat);
            tower1.position.set(-5, 3, -5);
            group.add(tower1);
            
            const tower2 = new THREE.Mesh(towerGeo, towerMat);
            tower2.position.set(5, 3, 5);
            group.add(tower2);
            
            scene.add(group);
            
            group.traverse((child) => {
                if (child.isMesh) {
                    child.geometry.computeBoundingBox();
                    mapColliders.push({
                        mesh: child,
                        localBox: child.geometry.boundingBox.clone(),
                        worldBox: new THREE.Box3()
                    });
                }
            });
            
            setTimeout(() => {
                mapColliders.forEach(c => {
                    c.mesh.updateMatrixWorld(true);
                    c.worldBox.copy(c.localBox).applyMatrix4(c.mesh.matrixWorld);
                });
            }, 100);
        }

        function createArenaBoundaries() {
            // Dark reflective ground
            const groundGeo = new THREE.PlaneGeometry(24, 24);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a0e,
                roughness: 0.4,
                metalness: 0.6
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid lines overlay
            const gridHelper = new THREE.GridHelper(24, 24, 0xff4500, 0x222233);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Boundary light fences (Dark cyber style)
            const borderMat = new THREE.MeshBasicMaterial({ color: 0xff4500, wireframe: true, transparent: true, opacity: 0.2 });
            const fenceGeo = new THREE.BoxGeometry(16, 8, 16);
            const fence = new THREE.Mesh(fenceGeo, borderMat);
            fence.position.y = 4;
            scene.add(fence);
        }

        /* =======================================================================
           HAND TRACKING & PLAYER COLLIDERS (Realistic Pitch Black Hands & Head)
           ======================================================================= */
        function createPitchBlackHand() {
            const handGroup = new THREE.Group();

            // Palm mesh
            const palmGeo = new THREE.BoxGeometry(0.1, 0.03, 0.11);
            const palm = new THREE.Mesh(palmGeo, pitchBlackMaterial);
            palm.castShadow = true;
            handGroup.add(palm);

            // Finger joints (Thumb + 4 Fingers)
            const fingerOffsets = [
                { x: 0.05, z: 0.04, len: 0.06 },   // Index
                { x: 0.02, z: 0.05, len: 0.07 },   // Middle
                { x: -0.01, z: 0.05, len: 0.065 }, // Ring
                { x: -0.04, z: 0.04, len: 0.05 },  // Pinky
                { x: 0.06, z: -0.02, len: 0.05 }   // Thumb
            ];

            fingerOffsets.forEach(f => {
                const fingerGeo = new THREE.CylinderGeometry(0.011, 0.013, f.len, 12);
                const finger = new THREE.Mesh(fingerGeo, pitchBlackMaterial);
                finger.position.set(f.x, 0, f.z + f.len / 2);
                finger.rotation.x = Math.PI / 2;
                finger.castShadow = true;
                handGroup.add(finger);
            });

            // Glowing emitter tip on palm center
            const tipGeo = new THREE.SphereGeometry(0.015, 12, 12);
            const tipMat = new THREE.MeshBasicMaterial({ color: 0xff4500 });
            const emitterTip = new THREE.Mesh(tipGeo, tipMat);
            emitterTip.name = "emitterTip";
            emitterTip.position.set(0, 0.02, 0.04);
            handGroup.add(emitterTip);

            return handGroup;
        }

        function setupHandsAndColliders() {
            // Left & Right Realistic Pitch Black Hands (Desktop fallback)
            leftHandMesh = createPitchBlackHand();
            rightHandMesh = createPitchBlackHand();

            leftHandMesh.position.set(-0.3, 1.2, -0.4);
            rightHandMesh.position.set(0.3, 1.2, -0.4);

            scene.add(leftHandMesh);
            scene.add(rightHandMesh);

            // Colliders (Hands & Head)
            const colliderMat = new THREE.MeshBasicMaterial({ visible: false });

            leftHandCollider = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), colliderMat);
            rightHandCollider = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), colliderMat);
            headCollider = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), colliderMat);

            scene.add(leftHandCollider);
            scene.add(rightHandCollider);
            scene.add(headCollider);

            // WebXR Hand Tracking Controllers
            hand0 = renderer.xr.getHand(0);
            hand1 = renderer.xr.getHand(1);

            hand0.addEventListener('connected', (event) => {
                hand0.handedness = event.data.handedness;
                setupHandVisuals(hand0);
            });
            hand1.addEventListener('connected', (event) => {
                hand1.handedness = event.data.handedness;
                setupHandVisuals(hand1);
            });

            scene.add(hand0);
            scene.add(hand1);

            // Add realistic hand models using XRHandModelFactory
            const handModelFactory = new XRHandModelFactory();
            const handModel0 = handModelFactory.createHandModel(hand0, 'mesh');
            hand0.add(handModel0);
            const handModel1 = handModelFactory.createHandModel(hand1, 'mesh');
            hand1.add(handModel1);
        }

        function setupHandVisuals(handController) {
             const jointMat = new THREE.MeshStandardMaterial({
                 color: 0x0a0a0a,
                 roughness: 0.05,
                 metalness: 0.95,
                 envMapIntensity: 1.0
             });

            const jointNames = [
                'wrist',
                'thumb-metacarpal', 'thumb-phalanx-proximal', 'thumb-phalanx-distal', 'thumb-tip',
                'index-finger-metacarpal', 'index-finger-phalanx-proximal', 'index-finger-phalanx-intermediate', 'index-finger-phalanx-distal', 'index-finger-tip',
                'middle-finger-metacarpal', 'middle-finger-phalanx-proximal', 'middle-finger-phalanx-intermediate', 'middle-finger-phalanx-distal', 'middle-finger-tip',
                'ring-finger-metacarpal', 'ring-finger-phalanx-proximal', 'ring-finger-phalanx-intermediate', 'ring-finger-phalanx-distal', 'ring-finger-tip',
                'pinky-finger-metacarpal', 'pinky-finger-phalanx-proximal', 'pinky-finger-phalanx-intermediate', 'pinky-finger-phalanx-distal', 'pinky-finger-tip'
            ];

            jointNames.forEach(name => {
                const jointGroup = handController.joints[name];
                if (jointGroup) {
                    let size = 0.008;
                    if (name.includes('tip')) size = 0.006;
                    if (name === 'wrist') size = 0.015;
                   
                    const sphereGeo = new THREE.SphereGeometry(size, 16, 16);
                     const sphere = new THREE.Mesh(sphereGeo, jointMat.clone());
                    sphere.castShadow = true;
                    sphere.receiveShadow = true;
                    jointGroup.add(sphere);
                     handJointMeshes.push(sphere);
                }
            });

            handController.bones = [];
           
            const connections = [
                ['wrist', 'thumb-metacarpal'],
                ['thumb-metacarpal', 'thumb-phalanx-proximal'],
                ['thumb-phalanx-proximal', 'thumb-phalanx-distal'],
                ['thumb-phalanx-distal', 'thumb-tip'],
                ['wrist', 'index-finger-metacarpal'],
                ['index-finger-metacarpal', 'index-finger-phalanx-proximal'],
                ['index-finger-phalanx-proximal', 'index-finger-phalanx-intermediate'],
                ['index-finger-phalanx-intermediate', 'index-finger-phalanx-distal'],
                ['index-finger-phalanx-distal', 'index-finger-tip'],
                ['wrist', 'middle-finger-metacarpal'],
                ['middle-finger-metacarpal', 'middle-finger-phalanx-proximal'],
                ['middle-finger-phalanx-proximal', 'middle-finger-phalanx-intermediate'],
                ['middle-finger-phalanx-intermediate', 'middle-finger-phalanx-distal'],
                ['middle-finger-phalanx-distal', 'middle-finger-tip'],
                ['wrist', 'ring-finger-metacarpal'],
                ['ring-finger-metacarpal', 'ring-finger-phalanx-proximal'],
                ['ring-finger-phalanx-proximal', 'ring-finger-phalanx-intermediate'],
                ['ring-finger-phalanx-intermediate', 'ring-finger-phalanx-distal'],
                ['ring-finger-phalanx-distal', 'ring-finger-tip'],
                ['wrist', 'pinky-finger-metacarpal'],
                ['pinky-finger-metacarpal', 'pinky-finger-phalanx-proximal'],
                ['pinky-finger-phalanx-proximal', 'pinky-finger-phalanx-intermediate'],
                ['pinky-finger-phalanx-intermediate', 'pinky-finger-phalanx-distal'],
                ['pinky-finger-phalanx-distal', 'pinky-finger-tip']
            ];

             const boneMat = new THREE.MeshStandardMaterial({
                 color: 0x020202,
                 roughness: 0.3,
                 metalness: 0.8,
                 envMapIntensity: 0.8
             });

            connections.forEach(conn => {
                const boneGeo = new THREE.CylinderGeometry(0.004, 0.004, 1, 8);
                 const boneMesh = new THREE.Mesh(boneGeo, boneMat.clone());
                boneMesh.castShadow = true;
                boneMesh.receiveShadow = true;
                scene.add(boneMesh);
                 handBoneMeshes.push(boneMesh);
               
                handController.bones.push({
                    mesh: boneMesh,
                    joint1: conn[0],
                    joint2: conn[1]
                });
            });
        }

        function checkHandMeshLoaded(handController) {
            if (handController.userData.hasMeshLoaded) return true;
            
            let hasMesh = false;
            handController.traverse(child => {
                if (child.isMesh && child !== leftHandMesh && child !== rightHandMesh && !handJointMeshes.includes(child) && !handBoneMeshes.includes(child)) {
                    hasMesh = true;
                }
            });
            
            if (hasMesh) {
                handController.userData.hasMeshLoaded = true;
            }
            return hasMesh;
        }

        function updateHandMaterials(handController) {
            if (handController.userData.materialsApplied) return;
            
            let applied = false;
            handController.traverse(child => {
                if (child.isMesh && 
                    child !== leftHandMesh && 
                    child !== rightHandMesh && 
                    !handJointMeshes.includes(child) && 
                    !handBoneMeshes.includes(child) && 
                    child.name !== 'emitterTip') {
                    
                    child.material = pitchBlackMaterial;
                    child.castShadow = true;
                    child.receiveShadow = true;
                    applied = true;
                }
            });
            
            if (applied) {
                handController.userData.materialsApplied = true;
            }
        }

        function getPinchPoint(handController) {
            const thumbTip = handController.joints['thumb-tip'];
            const indexTip = handController.joints['index-finger-tip'];
            if (thumbTip && indexTip && thumbTip.visible && indexTip.visible) {
                const p1 = new THREE.Vector3();
                const p2 = new THREE.Vector3();
                thumbTip.getWorldPosition(p1);
                indexTip.getWorldPosition(p2);
                return new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            }
            return null;
        }

        function updateHandBones(handController) {
            const hasMesh = checkHandMeshLoaded(handController);

            // Hide/show manual joints
            for (let name in handController.joints) {
                const jointGroup = handController.joints[name];
                if (jointGroup) {
                    for (let i = 0; i < jointGroup.children.length; i++) {
                        const child = jointGroup.children[i];
                        if (handJointMeshes.includes(child)) {
                            child.visible = !hasMesh;
                        }
                    }
                }
            }

            if (!handController.visible || !handController.bones) {
                if (handController.bones) {
                    for (let i = 0; i < handController.bones.length; i++) {
                        handController.bones[i].mesh.visible = false;
                    }
                }
                return;
            }

            if (hasMesh) {
                for (let i = 0; i < handController.bones.length; i++) {
                    handController.bones[i].mesh.visible = false;
                }
                return;
            }

            for (let i = 0; i < handController.bones.length; i++) {
                const bone = handController.bones[i];
                const j1 = handController.joints[bone.joint1];
                const j2 = handController.joints[bone.joint2];

                if (j1 && j2 && j1.visible && j2.visible) {
                    bone.mesh.visible = true;
                    const p1 = new THREE.Vector3();
                    const p2 = new THREE.Vector3();
                    j1.getWorldPosition(p1);
                    j2.getWorldPosition(p2);

                    const direction = new THREE.Vector3().subVectors(p2, p1);
                    const length = direction.length();
                    
                    if (length > 0.001) {
                        bone.mesh.scale.set(1, length, 1);
                        bone.mesh.position.copy(p1).addScaledVector(direction, 0.5);
                        
                        const up = new THREE.Vector3(0, 1, 0);
                        bone.mesh.quaternion.setFromUnitVectors(up, direction.clone().normalize());
                    }
                } else {
                    bone.mesh.visible = false;
                }
            }
        }

        function isPinching(handController) {
            if (!handController.visible) return false;
            const thumbTip = handController.joints['thumb-tip'];
            const indexTip = handController.joints['index-finger-tip'];
            if (thumbTip && indexTip) {
                const p1 = new THREE.Vector3();
                const p2 = new THREE.Vector3();
                thumbTip.getWorldPosition(p1);
                indexTip.getWorldPosition(p2);
                return p1.distanceTo(p2) < 0.025;
            }
            return false;
        }

        /* =======================================================================
           3D SANDBOX PHYSICS ENGINE & PARTICLES
           ======================================================================= */
        class PhysicsParticle {
            constructor(x, y, z, vx, vy, vz, type) {
                this.position = new THREE.Vector3(x, y, z);
                this.velocity = new THREE.Vector3(vx, vy, vz);
                this.type = type; // FIRE, WOOD, OIL, ICE, WATER, WALL
                this.life = type === 'FIRE' ? 1.5 : 8.0;
                this.maxLife = this.life;

                const geo = sharedGeometries[type];
                let mat;
                if (type === 'FIRE') {
                    mat = sharedMaterials.FIRE_TEMPLATE.clone();
                } else {
                    mat = sharedMaterials[type];
                }

                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.copy(this.position);
                this.mesh.castShadow = (type !== 'FIRE');
                scene.add(this.mesh);
            }

            update(dt, reactiveParticles) {
                this.life -= dt;

                if (this.type !== 'WALL') {
                    // Gravity & motion
                    if (this.type === 'FIRE') {
                        this.velocity.y += 2.5 * dt; // Rise up faster
                        this.velocity.x += (Math.random() - 0.5) * 1.2 * dt; // More turbulence
                        this.velocity.z += (Math.random() - 0.5) * 1.2 * dt;
                        
                        const lifeRatio = Math.max(0, this.life / this.maxLife);
                        this.mesh.scale.setScalar(lifeRatio * 1.5);
                        if (this.mesh.material) {
                            this.mesh.material.opacity = lifeRatio;
                            if (lifeRatio > 0.6) {
                                this.mesh.material.color.setRGB(1.0, 0.8, 0.2);
                            } else if (lifeRatio > 0.3) {
                                this.mesh.material.color.setRGB(1.0, 0.4, 0.0);
                            } else {
                                this.mesh.material.color.setRGB(0.8 * (lifeRatio / 0.3), 0.1 * (lifeRatio / 0.3), 0.0);
                            }
                        }
                    } else {
                        this.velocity.y -= 7.5 * dt; // Gravity down
                    }

                    this.position.addScaledVector(this.velocity, dt);

                    // Ground & Boundary collision
                    if (this.position.y < 0.05) {
                        this.position.y = 0.05;
                        this.velocity.y *= -0.3; // Dampen bounce
                        if (this.type === 'WATER' || this.type === 'OIL') {
                            this.velocity.x += (Math.random() - 0.5) * 1.5;
                            this.velocity.z += (Math.random() - 0.5) * 1.5;
                        }
                    }
                    
                    // Keep particles within arena bounds
                    if (this.position.x < arenaBounds.minX) {
                        this.position.x = arenaBounds.minX;
                        this.velocity.x *= -0.5;
                    } else if (this.position.x > arenaBounds.maxX) {
                        this.position.x = arenaBounds.maxX;
                        this.velocity.x *= -0.5;
                    }
                    if (this.position.z < arenaBounds.minZ) {
                        this.position.z = arenaBounds.minZ;
                        this.velocity.z *= -0.5;
                    } else if (this.position.z > arenaBounds.maxZ) {
                        this.position.z = arenaBounds.maxZ;
                        this.velocity.z *= -0.5;
                    }
                }

                // Collide with Crossroads map structures
                for (let i = 0; i < mapColliders.length; i++) {
                    const c = mapColliders[i];
                    if (c.worldBox.containsPoint(this.position)) {
                        resolveBoxCollision(this, c.worldBox);
                        break;
                    }
                }

                // Collide with player hands (joint-level)
                const handJoints = getHandJointPositions();
                for (let i = 0; i < handJoints.length; i++) {
                    const joint = handJoints[i];
                    const dist = this.position.distanceTo(joint.pos);
                    if (dist < joint.radius + 0.02) {
                        const normal = new THREE.Vector3().subVectors(this.position, joint.pos).normalize();
                        this.position.copy(joint.pos).addScaledVector(normal, joint.radius + 0.02);
                        this.velocity.reflect(normal).multiplyScalar(0.3);
                       
                        const handVel = joint.hand === 'left' ? handVelocities.left : handVelocities.right;
                        this.velocity.addScaledVector(handVel, 0.5);
                        triggerHaptic(10);
                    }
                }

                // Collide with head
                const headDist = this.position.distanceTo(camera.position);
                if (headDist < 0.2) {
                    const normal = new THREE.Vector3().subVectors(this.position, camera.position).normalize();
                    this.position.copy(camera.position).addScaledVector(normal, 0.22);
                    this.velocity.reflect(normal).multiplyScalar(0.5);
                    triggerHaptic(15);
                }

                this.mesh.position.copy(this.position);

                // Thermal interactions with other particles
                if (this.type === 'FIRE') {
                    for (let i = 0; i < reactiveParticles.length; i++) {
                        const other = reactiveParticles[i];
                        if (other === this || other.life <= 0) continue;
                        const dist = this.position.distanceTo(other.position);
                        if (dist < 0.25) {
                            if (other.type === 'WOOD' || other.type === 'OIL') {
                                other.type = 'FIRE';
                                other.mesh.material = sharedMaterials.FIRE_TEMPLATE.clone();
                                other.life = 1.2 + Math.random() * 0.6;
                                other.maxLife = other.life;
                                triggerHaptic(30);
                            } else if (other.type === 'ICE') {
                                other.type = 'WATER';
                                other.mesh.material = sharedMaterials.WATER;
                            } else if (other.type === 'WATER') {
                                this.life = 0; // Fire extinguished
                                other.life = 0; // Water evaporated
                                break;
                            }
                        }
                    }
                }

                // Thermal interactions with physics props
                for (let i = 0; i < physicsProps.length; i++) {
                    const prop = physicsProps[i];
                    const dist = this.position.distanceTo(prop.position);
                    if (dist < prop.radius + 0.1) {
                        if (this.type === 'FIRE') {
                            prop.temperature += 0.15;
                            if (prop.temperature > 0.5) {
                                prop.onFire = true;
                            }
                        } else if (this.type === 'ICE') {
                            prop.temperature = 0;
                            prop.onFire = false;
                        }
                    }
                }
            }

            destroy() {
                scene.remove(this.mesh);
                if (this.type === 'FIRE' && this.mesh.material) {
                    this.mesh.material.dispose();
                }
            }
        }

         class PhysicsProp {
             constructor(type, position, size, color) {
                 this.type = type; // 'box' or 'sphere'
                 this.position = position.clone();
                 this.velocity = new THREE.Vector3();
                 this.size = size;
                 this.temperature = 0;
                 this.onFire = false;
                
                 let geo, mat;
                 if (type === 'sphere') {
                     geo = new THREE.SphereGeometry(size, 16, 16);
                     mat = new THREE.MeshStandardMaterial({
                         color: color,
                         roughness: 0.3,
                         metalness: 0.8,
                     });
                     this.radius = size;
                 } else {
                     geo = new THREE.BoxGeometry(size.x, size.y, size.z);
                     mat = new THREE.MeshStandardMaterial({
                         color: color,
                         roughness: 0.5,
                         metalness: 0.2,
                     });
                     this.radius = Math.max(size.x, size.y, size.z) * 0.5;
                 }
                
                 this.mesh = new THREE.Mesh(geo, mat);
                 this.mesh.position.copy(this.position);
                 this.mesh.castShadow = true;
                 this.mesh.receiveShadow = true;
                 scene.add(this.mesh);
             }
            
             update(dt) {
                 if (grabbedProp === this) {
                     this.velocity.set(0, 0, 0);
                     this.mesh.position.copy(this.position);
                     return;
                 }
                
                 // Apply gravity
                 this.velocity.y -= 9.8 * dt;
                 // Apply air resistance
                 this.velocity.multiplyScalar(1 - 0.4 * dt);
                
                 // Update position
                 this.position.addScaledVector(this.velocity, dt);
                
                 // Ground collision
                 if (this.position.y < this.radius) {
                     this.position.y = this.radius;
                     this.velocity.y = -this.velocity.y * 0.4;
                     this.velocity.x *= 0.8;
                     this.velocity.z *= 0.8;
                 }
                
                 // Keep within arena bounds
                 const margin = this.radius;
                 if (this.position.x < arenaBounds.minX + margin) {
                     this.position.x = arenaBounds.minX + margin;
                     this.velocity.x = -this.velocity.x * 0.5;
                 }
                 if (this.position.x > arenaBounds.maxX - margin) {
                     this.position.x = arenaBounds.maxX - margin;
                     this.velocity.x = -this.velocity.x * 0.5;
                 }
                 if (this.position.z < arenaBounds.minZ + margin) {
                     this.position.z = arenaBounds.minZ + margin;
                     this.velocity.z = -this.velocity.z * 0.5;
                 }
                 if (this.position.z > arenaBounds.maxZ - margin) {
                     this.position.z = arenaBounds.maxZ - margin;
                     this.velocity.z = -this.velocity.z * 0.5;
                 }
                
                 // Map collisions
                 for (let c of mapColliders) {
                     if (c.worldBox.intersectsSphere({ center: this.position, radius: this.radius })) {
                         const closestPoint = new THREE.Vector3();
                         c.worldBox.clampPoint(this.position, closestPoint);
                         const dir = new THREE.Vector3().subVectors(this.position, closestPoint);
                         const dist = dir.length();
                         if (dist < this.radius) {
                             const normal = dist > 0.0001 ? dir.normalize() : new THREE.Vector3(0, 1, 0);
                             this.position.copy(closestPoint).addScaledVector(normal, this.radius);
                             this.velocity.reflect(normal).multiplyScalar(0.4);
                         }
                     }
                 }
                
                 // Hand collisions (pushing)
                 const handJoints = getHandJointPositions();
                 handJoints.forEach(joint => {
                     const dist = this.position.distanceTo(joint.pos);
                     if (dist < this.radius + joint.radius) {
                         const normal = new THREE.Vector3().subVectors(this.position, joint.pos).normalize();
                         this.position.copy(joint.pos).addScaledVector(normal, this.radius + joint.radius);
                        
                         const handVel = joint.hand === 'left' ? handVelocities.left : handVelocities.right;
                         const pushForce = handVel.length() > 0.1 ? handVel : normal.multiplyScalar(1.5);
                         this.velocity.copy(pushForce).multiplyScalar(1.2);
                         triggerHaptic(20);
                     }
                 });
                
                 // Temperature decay & Fire emission
                 if (this.temperature > 0) {
                     this.temperature -= 0.1 * dt;
                     if (this.temperature < 0) this.temperature = 0;
                 }
                
                 if (this.onFire) {
                     this.temperature -= 0.05 * dt;
                     if (this.temperature <= 0) {
                         this.onFire = false;
                     }
                    
                     if (Math.random() < 0.15) {
                         const spawnPos = this.position.clone().add(new THREE.Vector3(
                             (Math.random() - 0.5) * this.radius,
                             (Math.random() - 0.5) * this.radius,
                             (Math.random() - 0.5) * this.radius
                         ));
                         spawnParticle(spawnPos, new THREE.Vector3(0, 1, 0), 'FIRE');
                     }
                    
                     this.mesh.material.emissive.setHex(0xff4500);
                     this.mesh.material.emissiveIntensity = this.temperature * 2.0;
                 } else {
                     this.mesh.material.emissive.setHex(0x000000);
                     this.mesh.material.emissiveIntensity = 0;
                 }
                
                 this.mesh.position.copy(this.position);
             }
            
             destroy() {
                 scene.remove(this.mesh);
                 if (this.mesh.geometry) this.mesh.geometry.dispose();
                 if (this.mesh.material) this.mesh.material.dispose();
             }
         }

         function spawnPhysicsProps() {
             const colors = [0xff5555, 0x55ff55, 0x5555ff, 0xffff55, 0xff55ff, 0x55ffff];
            
             // Spheres
             for (let i = 0; i < 6; i++) {
                 const pos = new THREE.Vector3(
                     (Math.random() - 0.5) * 4,
                     1.5 + Math.random() * 2,
                     (Math.random() - 0.5) * 4
                 );
                 const radius = 0.15 + Math.random() * 0.1;
                 const color = colors[i % colors.length];
                 const prop = new PhysicsProp('sphere', pos, radius, color);
                 physicsProps.push(prop);
             }
            
             // Boxes
             for (let i = 0; i < 6; i++) {
                 const pos = new THREE.Vector3(
                     (Math.random() - 0.5) * 4,
                     1.5 + Math.random() * 2,
                     (Math.random() - 0.5) * 4
                 );
                 const size = new THREE.Vector3(
                     0.2 + Math.random() * 0.15,
                     0.2 + Math.random() * 0.15,
                     0.2 + Math.random() * 0.15
                 );
                 const color = colors[(i + 3) % colors.length];
                 const prop = new PhysicsProp('box', pos, size, color);
                 physicsProps.push(prop);
             }
         }

         function resolvePropCollisions() {
             for (let i = 0; i < physicsProps.length; i++) {
                 for (let j = i + 1; j < physicsProps.length; j++) {
                     const p1 = physicsProps[i];
                     const p2 = physicsProps[j];
                    
                     const dist = p1.position.distanceTo(p2.position);
                     const minDist = p1.radius + p2.radius;
                    
                     if (dist < minDist) {
                         const normal = new THREE.Vector3().subVectors(p2.position, p1.position).normalize();
                         const overlap = minDist - dist;
                        
                         p1.position.addScaledVector(normal, -overlap * 0.5);
                         p2.position.addScaledVector(normal, overlap * 0.5);
                        
                         const relativeVelocity = new THREE.Vector3().subVectors(p2.velocity, p1.velocity);
                         const velAlongNormal = relativeVelocity.dot(normal);
                        
                         if (velAlongNormal < 0) {
                             const restitution = 0.5;
                             const impulseScalar = -(1 + restitution) * velAlongNormal / 2;
                            
                             p1.velocity.addScaledVector(normal, -impulseScalar);
                             p2.velocity.addScaledVector(normal, impulseScalar);
                         }
                     }
                 }
             }
         }

         function getHandJointPositions() {
             const positions = [];
            
             if (renderer.xr.isPresenting) {
                 [hand0, hand1].forEach(hand => {
                     if (hand.visible) {
                         for (let name in hand.joints) {
                             const joint = hand.joints[name];
                             if (joint && joint.visible) {
                                 const pos = new THREE.Vector3();
                                 joint.getWorldPosition(pos);
                                 let radius = 0.015;
                                 if (name === 'wrist') radius = 0.04;
                                 else if (name.includes('tip')) radius = 0.012;
                                 positions.push({ pos, radius, name, hand: hand.handedness });
                             }
                         }
                     }
                 });
             } else {
                 positions.push({ pos: leftHandMesh.position, radius: 0.08, name: 'wrist', hand: 'left' });
                 positions.push({ pos: rightHandMesh.position, radius: 0.08, name: 'wrist', hand: 'right' });
             }
            
             return positions;
         }

         function updateHandVelocities(dt) {
             if (dt <= 0) return;
            
             let leftHand = null;
             let rightHand = null;
             if (hand0.handedness === 'left') leftHand = hand0;
             if (hand0.handedness === 'right') rightHand = hand0;
             if (hand1.handedness === 'left') leftHand = hand1;
             if (hand1.handedness === 'right') rightHand = hand1;
            
             if (leftHand && leftHand.joints['wrist'] && leftHand.visible) {
                 const pos = new THREE.Vector3();
                 leftHand.joints['wrist'].getWorldPosition(pos);
                 if (handVelocities.hasPrevLeft) {
                     handVelocities.left.subVectors(pos, handVelocities.prevLeftPos).divideScalar(dt);
                 }
                 handVelocities.prevLeftPos.copy(pos);
                 handVelocities.hasPrevLeft = true;
             } else {
                 handVelocities.hasPrevLeft = false;
                 handVelocities.left.set(0, 0, 0);
             }
            
             if (rightHand && rightHand.joints['wrist'] && rightHand.visible) {
                 const pos = new THREE.Vector3();
                 rightHand.joints['wrist'].getWorldPosition(pos);
                 if (handVelocities.hasPrevRight) {
                     handVelocities.right.subVectors(pos, handVelocities.prevRightPos).divideScalar(dt);
                 }
                 handVelocities.prevRightPos.copy(pos);
                 handVelocities.hasPrevRight = true;
             } else {
                 handVelocities.hasPrevRight = false;
                 handVelocities.right.set(0, 0, 0);
             }
         }

         function checkGrabbing() {
             let leftHand = null;
             let rightHand = null;
             if (hand0.handedness === 'left') leftHand = hand0;
             if (hand0.handedness === 'right') rightHand = hand0;
             if (hand1.handedness === 'left') leftHand = hand1;
             if (hand1.handedness === 'right') rightHand = hand1;
            
             if (rightHand && rightHand.visible) {
                 const pinching = isPinching(rightHand);
                 const indexTip = rightHand.joints['index-finger-tip'];
                 if (indexTip) {
                     const tipPos = new THREE.Vector3();
                     indexTip.getWorldPosition(tipPos);
                    
                     if (pinching && !grabbedProp) {
                         let closest = null;
                         let minDist = 0.4;
                         physicsProps.forEach(prop => {
                             const dist = prop.position.distanceTo(tipPos);
                             if (dist < minDist) {
                                 minDist = dist;
                                 closest = prop;
                             }
                         });
                         if (closest) {
                             grabbedProp = closest;
                             grabHand = 'right';
                             grabOffset.subVectors(closest.position, tipPos);
                             triggerHaptic(50);
                         }
                     } else if (!pinching && grabbedProp && grabHand === 'right') {
                         grabbedProp.velocity.copy(handVelocities.right).multiplyScalar(1.2);
                         grabbedProp = null;
                         grabHand = null;
                         triggerHaptic(30);
                     }
                 }
             }
            
             if (leftHand && leftHand.visible) {
                 const pinching = isPinching(leftHand);
                 const indexTip = leftHand.joints['index-finger-tip'];
                 if (indexTip) {
                     const tipPos = new THREE.Vector3();
                     indexTip.getWorldPosition(tipPos);
                    
                     if (pinching && !grabbedProp) {
                         let closest = null;
                         let minDist = 0.4;
                         physicsProps.forEach(prop => {
                             const dist = prop.position.distanceTo(tipPos);
                             if (dist < minDist) {
                                 minDist = dist;
                                 closest = prop;
                             }
                         });
                         if (closest) {
                             grabbedProp = closest;
                             grabHand = 'left';
                             grabOffset.subVectors(closest.position, tipPos);
                             triggerHaptic(50);
                         }
                     } else if (!pinching && grabbedProp && grabHand === 'left') {
                         grabbedProp.velocity.copy(handVelocities.left).multiplyScalar(1.2);
                         grabbedProp = null;
                         grabHand = null;
                         triggerHaptic(30);
                     }
                 }
             }
            
             if (grabbedProp) {
                 let activeHand = null;
                 if (grabHand === 'right') activeHand = rightHand;
                 if (grabHand === 'left') activeHand = leftHand;
                
                 if (activeHand && activeHand.visible) {
                     const indexTip = activeHand.joints['index-finger-tip'];
                     if (indexTip) {
                         const tipPos = new THREE.Vector3();
                         indexTip.getWorldPosition(tipPos);
                         grabbedProp.position.copy(tipPos).add(grabOffset);
                     }
                 } else {
                     grabbedProp = null;
                     grabHand = null;
                 }
             }
         }

         function initHandLights() {
             leftHandLight = new THREE.PointLight(0xff4500, 0, 3);
             rightHandLight = new THREE.PointLight(0xff4500, 0, 3);
             scene.add(leftHandLight);
             scene.add(rightHandLight);

         function updateHandGlow() {
             const colorHex = materialsList.find(m => m.name === activeMaterial)?.color || 0xff4500;
            
             pitchBlackMaterial.emissive.setHex(colorHex);
             pitchBlackMaterial.emissiveIntensity = 0.25;

             handJointMeshes.forEach(mesh => {
                 if (mesh.material) {
                     mesh.material.emissive.setHex(colorHex);
                     mesh.material.emissiveIntensity = 0.6;
                 }
             });
            
             handBoneMeshes.forEach(mesh => {
                 if (mesh.material) {
                     mesh.material.emissive.setHex(colorHex);
                     mesh.material.emissiveIntensity = 0.2;

             leftHandMesh.traverse(child => {
