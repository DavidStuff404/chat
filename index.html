========================= */

function sleep(ms) {
    return new Promise(resolve => {
        setTimeout(resolve, ms);
    });
}


function print(text = "", className = "") {

    const element =
        document.createElement("div");

    element.className =
        "line " + className;

    element.textContent =
        text;

    output.appendChild(element);

    screen.scrollTop =
        screen.scrollHeight;
}


function clearScreen() {

    output.innerHTML = "";

    return "";
}


function updatePrompt() {

    prompt.textContent =
        (currentUsername || "guest") +
        "@access:~$ ";

}


function focusInput() {

    requestAnimationFrame(() => {

        input.focus();

        const length =
            input.value.length;

        input.setSelectionRange(
            length,
            length
        );

    });
}


function usernameEmail(username) {

    return (
        username.toLowerCase() +
        "@access-terminal.invalid"
    );
}


function validUsername(username) {

    return /^[A-Za-z0-9_]{3,24}$/
        .test(username);

}


function validPassword(password) {

    return password.length >= 6;

}


/* =========================
   SESSION
========================= */

async function loadSession() {

    const result =
        await supabaseClient.auth.getSession();

    if (
        result.data &&
        result.data.session
    ) {

        currentUser =
            result.data.session.user;

        await loadProfile();

    }

    updatePrompt();
}


async function loadProfile() {

    if (!currentUser) {
        return;
    }

    const result =
        await supabaseClient
            .from("profiles")
            .select("username")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if (result.error) {

        currentUsername =
            currentUser
                .user_metadata
                ?.username ||
            null;

    } else if (result.data) {

        currentUsername =
            result.data.username;

    } else {

        currentUsername =
            currentUser
                .user_metadata
                ?.username ||
            null;

    }

    updatePrompt();
}

   SIGNUP
========================= */

async function signup(args) {

    if (args.length < 2) {

        return (
            "USAGE: Signup [user] [password]"
        );

    }


    const username =
        args[0];

    const password =
        args.slice(1).join(" ");


    if (!validUsername(username)) {

        return (
            "ERROR: INVALID USERNAME.\n" +
            "USERNAME MUST BE 3-24 CHARACTERS.\n" +
            "LETTERS, NUMBERS AND _ ONLY."
        );

    }


    if (!validPassword(password)) {

        return (
            "ERROR: PASSWORD MUST CONTAIN " +
            "AT LEAST 6 CHARACTERS."
        );

    }


    const existing =
        await supabaseClient
            .from("profiles")
            .select("id")
            .eq(
                "username",
                username
            )
            .maybeSingle();


    if (existing.error) {

        return (
            "DATABASE ERROR: " +
            existing.error.message
        );

    }


    if (existing.data) {

        return (
            "ERROR: USERNAME ALREADY EXISTS."
        );

    }


    const result =
        await supabaseClient.auth.signUp({

            email:
                usernameEmail(username),

            password:

                password,

            options: {

                data: {
                    username:
                        username
                }

            }

        });


    if (result.error) {

        return (
            "SIGNUP ERROR: " +
            result.error.message
        );

    }


    currentUser =
        result.data.user;

    currentUsername =
        username;


    updatePrompt();


    if (!result.data.session) {

        return (
            "ACCOUNT CREATED.\n" +
            "EMAIL CONFIRMATION MAY BE REQUIRED " +
            "BEFORE LOGIN."
        );

    }


    return (
        "ACCOUNT CREATED.\n" +
        "WELCOME, " +
        username +
        "."
    );
}

async function login(args) {

        return (
            "USAGE: Login [user] [password]"
        );

    }


    const username =
        args[0];

    const password =
        args.slice(1).join(" ");


    const result =
        await supabaseClient.auth
            .signInWithPassword({

                email:
                    usernameEmail(username),

                password:
                    password

            });


    if (result.error) {

        return (
            "LOGIN ERROR: " +
            result.error.message
        );

    }


    currentUser =
        result.data.user;


    await loadProfile();


    return (
        "LOGIN SUCCESSFUL.\n" +
        "WELCOME, " +
        (
            currentUsername ||
            username
        ) +
        "."
    );
}

        await supabaseClient.auth.signOut();


    if (result.error) {

        return (

            result.error.message
        );

    }


    currentUser = null;
    currentUsername = null;

    updatePrompt();


    return "LOGGED OUT.";
}

async function listUsers() {

    const result =
        await supabaseClient
            .from("profiles")
            .select(
                "username,created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (result.error) {

        return (
            "USERS ERROR: " +
            result.error.message
        );

    }


    if (!result.data.length) {

        return "NO REGISTERED USERS.";

    }


    const lines = [
        "REGISTERED USERS",
        "================",
        ""
    ];


    result.data.forEach(
        (user, index) => {

            lines.push(
                String(index + 1)
                    .padStart(3, "0") +
                "  " +
                user.username
            );

        }
    );


    lines.push("");
    lines.push(
        "TOTAL: " +
        result.data.length
    );


    return lines.join("\n");
}

async function showForum() {

    const result =
        await supabaseClient
            .from("forum_messages")
            .select(
                "username,message,created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            )
            .limit(100);


    if (result.error) {

        return (
            "FORUM ERROR: " +
            result.error.message
        );

    }


    if (!result.data.length) {

        return (
            "GLOBAL FORUM\n\n" +
            "No messages yet.\n\n" +
            "POST A MESSAGE WITH:\n" +
            "Forum [message]"
        );

    }


    const lines = [
        "GLOBAL FORUM",
        "============",
        ""
    ];


    result.data.forEach(message => {

        const date =
            new Date(
                message.created_at
            ).toLocaleString();


        lines.push(
            "[" +
            date +
            "] " +
            message.username +
            ": " +
            message.message
        );

    });


    return lines.join("\n");
}


async function postForum(args) {

    if (!currentUser) {

        return (
            "ERROR: LOGIN REQUIRED.\n" +
            "USE: Login [user] [password]"
        );

    }


    const message =
        args.join(" ").trim();


    if (!message) {

        return (
            "USAGE: Forum [message]"
        );

    }


    if (message.length > 500) {

        return (
            "ERROR: MESSAGE TOO LONG.\n" +
            "MAXIMUM: 500 CHARACTERS."
        );

    }


    if (!currentUsername) {

        await loadProfile();

    }


    const result =
        await supabaseClient
            .from("forum_messages")
            .insert({

                user_id:
                    currentUser.id,

                username:
                    currentUsername ||
                    "unknown",

                message:
                    message

            });


    if (result.error) {

        return (
            "FORUM ERROR: " +
            result.error.message
        );

    }


    return "MESSAGE POSTED.";
}


/* =========================
   FORUM REALTIME
========================= */

function subscribeForum() {

    if (forumChannel) {

        supabaseClient.removeChannel(
            forumChannel
        );

    }


    forumChannel =
        supabaseClient
            .channel(
                "access-global-forum"
            )

            .on(
                "postgres_changes",

                {
                    event: "INSERT",
                    schema: "public",
                    table: "forum_messages"
                },

                payload => {

                    const message =
                        payload.new;


                    print(
                        "[FORUM] " +
                        message.username +
                        ": " +
                        message.message,

                        "cyan"
                    );

                }

            )

            .subscribe();
}

async function runCommand(raw) {

    const commandLine =
        raw.trim();


    if (!commandLine) {
        return;
    }


    commandHistory.push(
        commandLine
    );


    historyIndex =
        commandHistory.length;


    print(
        (
            currentUsername ||
            "guest"
        ) +
        "@access:~$ " +
        commandLine,

        "white"
    );


    const parts =
        commandLine.match(
            /(?:[^\s"]+|"[^"]*")+/g
        ) || [];


    const command =
        (
            parts.shift() ||
            ""
        ).toLowerCase();


    const args =
        parts.map(value =>
            value.replace(
                /^"|"$/g,
                ""
            )
        );


    if (!commands[command]) {

        print(
            "COMMAND NOT FOUND: " +
            command,
            "red"
        );

        print(
            "TYPE HELP FOR AVAILABLE COMMANDS.",
            "dim"
        );

        return;

    }


    try {

        const result =
            await commands[command](args);


        if (result) {

            print(result);

        }

    } catch (error) {

        print(
            "COMMAND ERROR: " +
            error.message,
            "red"
        );

    }
}


/* =========================
   MATRIX
========================= */

function createMatrix() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.style.position =
        "fixed";

    canvas.style.left =
        "0";

    canvas.style.top =
        "0";

    canvas.style.width =
        "100%";

    canvas.style.height =
        "100%";

    canvas.style.zIndex =
        "-1";

    canvas.style.pointerEvents =
        "none";


    document.body.appendChild(
        canvas
    );


    const context =
        canvas.getContext("2d");


    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;


    const characters =
        "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";


    const size = 15;


    const columns =
        Math.floor(
            canvas.width / size
        );


    const drops =
        Array(columns).fill(1);


    let frames = 0;


    function draw() {

        context.fillStyle =
            "rgba(0,0,0,0.08)";


        context.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        context.fillStyle =
            "#00ff55";

        context.font =
            size +
            "px monospace";


        for (
            let i = 0;
            i < drops.length;
            i++
        ) {

            const character =
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ];


            context.fillText(
                character,
                i * size,
                drops[i] * size
            );


            if (
                drops[i] * size >
                    canvas.height &&
                Math.random() > 0.975
            ) {

                drops[i] = 0;

            }


            drops[i]++;

        }


        frames++;


        if (frames < 250) {

            requestAnimationFrame(
                draw
            );

        } else {

            canvas.remove();

        }
    }


    draw();
}


/* =========================
   KEYBOARD
========================= */

input.addEventListener(
    "keydown",
    async event => {

        if (event.key === "Enter") {

            event.preventDefault();
            event.stopPropagation();


            const value =
                input.value;


            input.value = "";


            if (value.trim()) {

                await runCommand(
                    value
                );

            }


            focusInput();

            return;
        }


        if (event.key === "ArrowUp") {

            event.preventDefault();


            if (
                commandHistory.length
            ) {

                historyIndex =
                    Math.max(
                        0,
                        historyIndex - 1
                    );


                input.value =
                    commandHistory[
                        historyIndex
                    ] || "";

            }


            return;
        }


        if (event.key === "ArrowDown") {

            event.preventDefault();


            if (
                commandHistory.length
            ) {

                historyIndex =
                    Math.min(
                        commandHistory.length,
                        historyIndex + 1
                    );


                input.value =
                    commandHistory[
                        historyIndex
                    ] || "";

            }


            return;
        }


        if (event.key === "Tab") {

            event.preventDefault();


            const typed =
                input.value
                    .toLowerCase();


            const matches =
                Object.keys(commands)
                    .filter(command =>
                        command.startsWith(
                            typed
                        )
                    );


            if (
                matches.length === 1
            ) {

                input.value =
                    matches[0];

            }

        }

    }
);
